<meta name="mobile-web-app-capable" content="yes">

<style>
/* Focus — design tokens
   Layout idea: a quiet Apple-style shell (icon rail + open canvas); the clock is the one loud element. */
:root {
  --bg: #F2F2F7; --card: #FFFFFF; --card2: #EDEDF2; --raise: #FFFFFF;
  --line: rgba(60, 60, 67, .13); --line2: rgba(60, 60, 67, .22);
  --text: #1D1D1F; --text2: rgba(60, 60, 67, .74); --text3: rgba(60, 60, 67, .46);
  --good: #1E8E3E; --warn: #B86E00; --bad: #D4281C;
  --accent: #946F1B; --accent-ink: #FFFFFF; --accent-soft: rgba(148, 111, 27, .13);
  --shadow: 0 1px 2px rgba(0, 0, 0, .04), 0 10px 30px rgba(0, 0, 0, .07);
  --c1: #2a78d6; --c2: #eb6834; --c3: #1baf7a; --c4: #eda100; --c5: #e87ba4; --c6: #008300; --c7: #6250d6; --c8: #e34948;
  --bronze-a: #E7AE7F; --bronze-b: #8A5127; --silver-a: #F4F4F7; --silver-b: #8B8B94;
  --gold-a: #FFE39A; --gold-b: #B5830F; --plat-a: #EAF6FF; --plat-b: #6E9BC0;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --round: ui-rounded, "SF Pro Rounded", -apple-system, BlinkMacSystemFont, "Helvetica Neue", "Segoe UI", Roboto, Arial, sans-serif;
  --r-lg: 26px; --r-md: 18px; --r-sm: 12px;
  --sat: env(safe-area-inset-top, 0px); --sab: env(safe-area-inset-bottom, 0px);
  --sal: env(safe-area-inset-left, 0px); --sar: env(safe-area-inset-right, 0px);
  color-scheme: light;
}
:root[data-theme="dark"] {
  --bg: #000000; --card: #131315; --card2: #1E1E21; --raise: #26262A;
  --line: rgba(255, 255, 255, .085); --line2: rgba(255, 255, 255, .17);
  --text: #F5F5F7; --text2: rgba(235, 235, 245, .64); --text3: rgba(235, 235, 245, .36);
  --good: #30D158; --warn: #FFB340; --bad: #FF5A4F;
  --accent: #DDB96F; --accent-ink: #1B1404; --accent-soft: rgba(221, 185, 111, .15);
  --shadow: 0 1px 0 rgba(255, 255, 255, .03) inset, 0 20px 50px rgba(0, 0, 0, .5);
  --c1: #3987e5; --c2: #d95926; --c3: #199e70; --c4: #c98500; --c5: #d55181; --c6: #0ca30c; --c7: #9085e9; --c8: #e66767;
  color-scheme: dark;
}
:root[data-accent="blue"] { --accent: #0071E3; --accent-ink: #fff; --accent-soft: rgba(0, 113, 227, .12); }
:root[data-accent="green"] { --accent: #1E8E3E; --accent-ink: #fff; --accent-soft: rgba(30, 142, 62, .13); }
:root[data-accent="orange"] { --accent: #C25E00; --accent-ink: #fff; --accent-soft: rgba(194, 94, 0, .13); }
:root[data-accent="purple"] { --accent: #8944AB; --accent-ink: #fff; --accent-soft: rgba(137, 68, 171, .13); }
:root[data-accent="pink"] { --accent: #D30F45; --accent-ink: #fff; --accent-soft: rgba(211, 15, 69, .11); }
:root[data-accent="silver"] { --accent: #1D1D1F; --accent-ink: #fff; --accent-soft: rgba(29, 29, 31, .09); }
:root[data-theme="dark"][data-accent="blue"] { --accent: #2997FF; --accent-ink: #00101F; --accent-soft: rgba(41, 151, 255, .16); }
:root[data-theme="dark"][data-accent="green"] { --accent: #30D158; --accent-ink: #03200C; --accent-soft: rgba(48, 209, 88, .15); }
:root[data-theme="dark"][data-accent="orange"] { --accent: #FF9F0A; --accent-ink: #211300; --accent-soft: rgba(255, 159, 10, .15); }
:root[data-theme="dark"][data-accent="purple"] { --accent: #BF5AF2; --accent-ink: #1A0526; --accent-soft: rgba(191, 90, 242, .16); }
:root[data-theme="dark"][data-accent="pink"] { --accent: #FF4F79; --accent-ink: #26000C; --accent-soft: rgba(255, 79, 121, .16); }
:root[data-theme="dark"][data-accent="silver"] { --accent: #E8E8ED; --accent-ink: #000; --accent-soft: rgba(232, 232, 237, .13); }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--text); font-family: var(--font); font-size: 15px; line-height: 1.35;
  -webkit-font-smoothing: antialiased; overflow: hidden; overscroll-behavior: none;
  -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
}
input, textarea, select, button { font: inherit; color: inherit; }
input, textarea { -webkit-user-select: text; user-select: text; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
h1, h2, h3, h4, p { margin: 0; }
svg { display: block; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- shell ---------- */
.app { height: 100%; display: grid; grid-template-columns: calc(86px + var(--sal)) minmax(0, 1fr); }
.rail {
  padding: calc(18px + var(--sat)) 0 calc(14px + var(--sab)) var(--sal); display: flex; flex-direction: column; align-items: center; gap: 4px;
  border-right: 1px solid var(--line);
}
.rail-btn {
  width: 68px; padding: 9px 0 7px; border-radius: 16px; display: flex; flex-direction: column; align-items: center; gap: 4px;
  color: var(--text3); font-size: 10.5px; font-weight: 600; letter-spacing: .01em; position: relative; transition: color .15s, background .15s;
}
.rail-btn.on { color: var(--accent); background: var(--accent-soft); }
.rail-btn .count {
  position: absolute; top: 4px; right: 12px; min-width: 17px; height: 17px; padding: 0 5px; border-radius: 9px;
  background: var(--bad); color: #fff; font-size: 10.5px; font-weight: 700; display: grid; place-items: center;
}
.rail .sp { flex: 1; }
.main { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.topbar {
  flex: none; height: calc(70px + var(--sat)); padding: var(--sat) calc(26px + var(--sar)) 0 30px;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px;
}
.tb-left { display: flex; align-items: baseline; gap: 12px; min-width: 0; padding-right: 30px; overflow: hidden; }
/* JSR Enterprises wordmark: a long black pill, centred on the screen */
.brand { height: 36px; padding: 0 22px; border-radius: 18px; background: #000; display: flex; align-items: center; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .2); transform: translateX(calc((-86px - var(--sal)) / 2)); }
.brand img { height: 11px; width: auto; display: block; }
.brand-fixed { position: fixed; top: calc(18px + var(--sat)); left: 50%; transform: translateX(-50%); z-index: 5; opacity: .6; display: none; }
.tb-title { font-size: 28px; font-weight: 700; letter-spacing: -.022em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 0 0 auto; max-width: 100%; }
.tb-sub { color: var(--text3); font-size: 14px; font-weight: 500; white-space: nowrap; flex: 0 100 auto; min-width: 0; }
.tb-right { justify-self: end; display: flex; align-items: center; gap: 10px; min-width: 0; }
.pill {
  height: 36px; padding: 0 14px 0 11px; border-radius: 18px; background: var(--card); border: 1px solid var(--line);
  display: inline-flex; align-items: center; gap: 7px; font-size: 14px; font-weight: 600; white-space: nowrap;
}
.pill svg { color: var(--accent); }
.pill.risk svg { color: var(--text3); }
.view { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 6px calc(26px + var(--sar)) calc(28px + var(--sab)) 30px; -webkit-overflow-scrolling: touch; }
.view.fixed { overflow: hidden; display: flex; flex-direction: column; }

/* ---------- common pieces ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px 22px; min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; margin-bottom: 14px; }
.card-h h3 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.card-h .more { margin-left: auto; color: var(--accent); font-size: 14px; font-weight: 600; }
.row { display: flex; align-items: center; gap: 10px; min-width: 0; }
.grow { flex: 1; min-width: 0; }
.muted { color: var(--text2); } .faint { color: var(--text3); }
.small { font-size: 13px; } .tiny { font-size: 12px; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 9px; height: 9px; border-radius: 50%; flex: none; display: inline-block; }

.btn {
  height: 44px; padding: 0 20px; border-radius: 22px; background: var(--card2); font-weight: 600; font-size: 15px;
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; white-space: nowrap; transition: transform .12s, opacity .15s;
}
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.ghost { background: transparent; border: 1px solid var(--line2); }
.btn.danger { color: var(--bad); }
.btn.sm { height: 34px; padding: 0 14px; font-size: 13.5px; border-radius: 17px; }
.btn[disabled] { opacity: .4; pointer-events: none; }
.icon-btn { width: 40px; height: 40px; border-radius: 50%; display: inline-grid; place-items: center; color: var(--text2); flex: none; }
.icon-btn:active { background: var(--card2); }
.icon-btn.on { color: var(--accent); background: var(--accent-soft); }

.seg { display: inline-flex; padding: 3px; border-radius: 13px; background: var(--card2); gap: 2px; }
.seg button { height: 34px; padding: 0 16px; border-radius: 10px; font-size: 14px; font-weight: 600; color: var(--text2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.seg button.on { background: var(--raise); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .14); }
:root[data-theme="dark"] .seg button.on { background: #3A3A3F; }

.chip {
  height: 36px; padding: 0 15px; border-radius: 18px; border: 1px solid var(--line2); font-size: 14px; font-weight: 600; color: var(--text2);
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap; flex: none;
}
.chip.on { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }

.switch { width: 51px; height: 31px; border-radius: 16px; background: var(--card2); border: 1px solid var(--line2); position: relative; flex: none; transition: background .2s; }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 25px; height: 25px; border-radius: 50%; background: #fff; box-shadow: 0 2px 5px rgba(0, 0, 0, .25); transition: transform .2s; }
.switch.on { background: var(--good); border-color: transparent; }
.switch.on::after { transform: translateX(20px); }

.input, .select, .textarea {
  height: 44px; width: 100%; padding: 0 14px; border-radius: 12px; background: var(--card2); border: 1px solid transparent; outline: none; font-size: 16px;
}
.textarea { height: auto; min-height: 84px; padding: 11px 14px; resize: none; line-height: 1.4; }
.input:focus, .select:focus, .textarea:focus { border-color: var(--accent); }
.input.num-in { width: 92px; text-align: right; font-variant-numeric: tabular-nums; }
.select { -webkit-appearance: none; appearance: none; padding-right: 34px; background-image: linear-gradient(45deg, transparent 50%, var(--text3) 50%), linear-gradient(135deg, var(--text3) 50%, transparent 50%); background-position: calc(100% - 19px) 19px, calc(100% - 14px) 19px; background-size: 5px 5px; background-repeat: no-repeat; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: 13px; font-weight: 600; color: var(--text2); }
.fields { display: grid; gap: 14px; }
.fields.two { grid-template-columns: 1fr 1fr; }

.bar { height: 6px; border-radius: 3px; background: var(--card2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 3px; background: var(--accent); min-width: 0; transition: width .5s cubic-bezier(.2, .8, .2, 1); }
.empty { padding: 26px 10px; text-align: center; color: var(--text3); font-size: 14px; }
.empty b { display: block; color: var(--text2); font-size: 15px; margin-bottom: 4px; font-weight: 600; }
.tagline { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--text2); min-width: 0; }
.stars { display: inline-flex; gap: 1px; color: var(--accent); }
.stars .off { color: var(--line2); }
.stepper { display: inline-flex; align-items: center; background: var(--card2); border-radius: 12px; height: 36px; }
.stepper button { width: 36px; height: 36px; display: grid; place-items: center; color: var(--text2); }
.stepper span { min-width: 26px; text-align: center; font-weight: 650; font-variant-numeric: tabular-nums; }

/* ---------- modal, toast ---------- */
.modal-back {
  position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, .42); display: grid; place-items: center;
  padding: calc(20px + var(--sat)) 20px calc(20px + var(--sab)); opacity: 0; transition: opacity .2s;
  -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
}
.modal-back.in { opacity: 1; }
.modal {
  width: min(540px, 100%); max-height: 100%; display: flex; flex-direction: column; background: var(--card); border: 1px solid var(--line);
  border-radius: 28px; box-shadow: var(--shadow); transform: translateY(14px) scale(.98); transition: transform .26s cubic-bezier(.2, .9, .3, 1); overflow: hidden;
}
.modal-back.in .modal { transform: none; }
.modal.wide { width: min(760px, 100%); }
.modal-h { padding: 22px 24px 6px; display: flex; align-items: flex-start; gap: 12px; }
.modal-h h2 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.modal-h p { color: var(--text2); font-size: 14px; margin-top: 4px; }
.modal-h .icon-btn { margin: -6px -8px 0 auto; background: var(--card2); width: 34px; height: 34px; }
.modal-b { padding: 14px 24px 8px; overflow-y: auto; -webkit-overflow-scrolling: touch; }
.modal-f { padding: 14px 24px 22px; display: flex; gap: 10px; justify-content: flex-end; align-items: center; }
.modal-f .left { margin-right: auto; }
#toast-root { position: fixed; left: 0; right: 0; bottom: calc(34px + var(--sab)); z-index: 80; display: grid; place-items: center; pointer-events: none; }
.toast {
  padding: 12px 20px; border-radius: 22px; background: var(--text); color: var(--bg); font-weight: 600; font-size: 14.5px; max-width: 86vw;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .3); animation: toast-in .25s cubic-bezier(.2, .9, .3, 1);
}
@keyframes toast-in { from { opacity: 0; transform: translateY(10px); } }

/* ---------- portrait and narrow screens ---------- */
@media (orientation: portrait), (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr) auto; }
  .rail {
    grid-row: 2; flex-direction: row; justify-content: space-around; padding: 6px calc(8px + var(--sar)) calc(6px + var(--sab)) calc(8px + var(--sal));
    border-right: 0; border-top: 1px solid var(--line); gap: 0;
  }
  .rail .sp { display: none; }
  .rail-btn { width: auto; flex: 1; max-width: 96px; }
  .topbar { padding-left: calc(22px + var(--sal)); padding-right: calc(20px + var(--sar)); }
  .view { padding-left: calc(22px + var(--sal)); padding-right: calc(20px + var(--sar)); }
  .brand { transform: none; }
  .tb-left { padding-right: 0; }
  .brand-fixed { transform: translateX(-50%); }
}
@media (max-width: 560px) {
  .tb-title { font-size: 20px; }
  .pill.rank { display: none; }
  .topbar { gap: 8px; }
  .brand { height: 26px; padding: 0 11px; border-radius: 13px; }
  .brand img { height: 6px; }
  .pill { padding: 0 10px 0 8px; height: 32px; font-size: 13px; }
  .rail-btn span.lb { display: none; }
  .fields.two { grid-template-columns: 1fr; }
  .view { padding-left: 16px; padding-right: 16px; }
  .topbar { padding-left: 16px; padding-right: 16px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* ---------- Focus screen ---------- */
.focus-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(330px, 37%) minmax(0, 1fr); gap: 26px; }
.todo { display: flex; flex-direction: column; min-height: 0; padding: 20px 14px 14px; }
.todo-h { display: flex; align-items: center; gap: 10px; padding: 0 8px 12px; }
.todo-h h3 { font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
.todo-list { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; margin: 0 -4px; padding: 0 4px; }
.todo-sec { font-size: 12.5px; font-weight: 650; color: var(--text3); padding: 12px 10px 5px; }
.task { display: flex; align-items: center; gap: 4px; padding: 5px 4px 5px 8px; border-radius: 16px; min-height: 54px; }
.task.sel, .task.active { background: var(--accent-soft); }
.check { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line2); display: grid; place-items: center; color: transparent; flex: none; margin-right: 6px; transition: background .15s, border-color .15s; }
.check.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.task-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; padding: 5px 0; }
.task-title { font-size: 15.5px; font-weight: 550; line-height: 1.25; overflow-wrap: anywhere; }
.task.done .task-title { color: var(--text3); text-decoration: line-through; }
.task-meta { display: flex; flex-wrap: wrap; gap: 3px 12px; align-items: center; }
.pri { font-style: normal; font-weight: 800; color: var(--bad); margin-right: 5px; }
.carried { color: var(--warn); }
.rdots { display: inline-flex; gap: 3px; align-items: center; }
.rdots i { width: 7px; height: 7px; border-radius: 50%; background: var(--line2); }
.rdots i.on { background: var(--accent); }
.rdots.rd-lg { margin: 0 4px 0 12px; gap: 5px; }
.rdots.rd-lg i { width: 9px; height: 9px; }
.rdots.rd-lg i.cur { background: transparent; box-shadow: inset 0 0 0 2px var(--accent); }
.icon-btn.star { color: var(--text3); width: 36px; height: 36px; }
.icon-btn.star.on { color: var(--accent); background: none; }
.task-play { width: 36px; height: 36px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; color: var(--text); flex: none; }
.task.active .task-play { background: var(--accent); color: var(--accent-ink); }
.task.done .star { visibility: hidden; }
.quick-add { display: flex; gap: 6px; align-items: center; padding: 12px 6px 0; }
.quick-add .icon-btn { background: var(--card2); width: 44px; height: 44px; color: var(--text); }

.stage { min-height: 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 12px; padding-bottom: 4px; }
.stage-top { width: 100%; display: flex; align-items: center; gap: 4px; min-height: 42px; }
.chip.static { border-color: transparent; background: var(--card); color: var(--text2); cursor: default; }
.chip.static.on { background: var(--accent-soft); color: var(--accent); }
.tagbar { display: flex; flex-direction: column; align-items: center; gap: 6px; max-width: 100%; min-width: 0; }
.tagpick { max-width: 100%; height: 40px; padding: 0 16px; border-radius: 20px; background: var(--card); border: 1px solid var(--line); display: inline-flex; align-items: center; gap: 9px; font-weight: 600; font-size: 15px; min-width: 0; }
.tagpick[disabled] { opacity: 1; cursor: default; }
.tagpick svg { color: var(--text3); }
.now-task { font-size: 14.5px; color: var(--text2); max-width: 100%; display: flex; align-items: center; gap: 6px; }
.unlink { width: 20px; height: 20px; border-radius: 50%; background: var(--card2); display: inline-grid; place-items: center; color: var(--text3); flex: none; }
.clock-wrap { flex: 1; min-height: 0; width: 100%; display: grid; place-items: center; container-type: size; }
.clock { --cs: min(100cqh, 100cqw, 520px); width: var(--cs); height: var(--cs); position: relative; display: grid; place-items: center; }
.clock svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.clock-in { position: relative; display: flex; flex-direction: column; align-items: center; gap: calc(var(--cs) * .012); text-align: center; }
.ck-label { font-size: calc(var(--cs) * .042); font-weight: 600; color: var(--accent); letter-spacing: .01em; }
.ck-sub { font-size: calc(var(--cs) * .038); color: var(--text3); font-weight: 500; font-variant-numeric: tabular-nums; }
.digits { font-size: calc(var(--cs) * .235); font-weight: 200; letter-spacing: -.035em; line-height: 1; font-variant-numeric: tabular-nums; font-feature-settings: "tnum" 1, "ss01" 1; }
.digits.long { font-size: calc(var(--cs) * .175); }

.face-ring .trk { fill: none; stroke: var(--card2); stroke-width: 7; }
.face-ring .prg { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 200px 200px; transition: stroke-dashoffset .25s linear; filter: drop-shadow(0 0 7px var(--accent)); }
:root[data-theme="light"] .face-ring .prg { filter: none; }
.face-dial line { stroke: var(--line2); stroke-width: 2.2; stroke-linecap: round; transition: stroke .3s; }
.face-dial line.big { stroke-width: 3.2; }
.face-dial line.on { stroke: var(--accent); }
.face-digital { height: auto; min-height: calc(var(--cs) * .5); }
.face-digital .digits { font-size: calc(var(--cs) * .34); font-weight: 650; font-family: var(--round); letter-spacing: -.03em; }
.face-digital .digits.long { font-size: calc(var(--cs) * .25); }
.bar.lin { position: absolute; left: 12%; right: 12%; bottom: 0; height: 5px; }
.bar.lin > i { transition: width .25s linear; }
.face-flip { height: auto; display: flex; flex-direction: column; align-items: center; gap: calc(var(--cs) * .035); padding-bottom: calc(var(--cs) * .07); }
.flip-row { display: flex; align-items: center; gap: calc(var(--cs) * .018); }
.fc { display: grid; place-items: center; width: calc(var(--cs) * .19); height: calc(var(--cs) * .27); border-radius: calc(var(--cs) * .03); background: var(--card); border: 1px solid var(--line); font-size: calc(var(--cs) * .2); font-weight: 650; font-family: var(--round); font-variant-numeric: tabular-nums; position: relative; overflow: hidden; }
.fc::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 1.5px; background: var(--bg); opacity: .8; }
.fc.flip { animation: flip .32s cubic-bezier(.3, .8, .3, 1); }
@keyframes flip { 0% { transform: perspective(500px) rotateX(-70deg); opacity: .3; } 100% { transform: none; opacity: 1; } }
.colon { font-style: normal; font-size: calc(var(--cs) * .15); font-weight: 600; color: var(--text3); margin: 0 calc(var(--cs) * .004); }

.face-break .digits { font-size: calc(var(--cs) * .16); font-weight: 300; }
.breath { position: absolute; inset: 9%; }
.breath i { position: absolute; inset: 0; border-radius: 50%; background: var(--accent); opacity: .1; animation: breathe 10s ease-in-out infinite; }
.breath i:nth-child(2) { inset: 13%; opacity: .12; animation-delay: .25s; }
.breath i:nth-child(3) { inset: 26%; opacity: .14; animation-delay: .5s; }
@keyframes breathe { 0% { transform: scale(.8); } 40% { transform: scale(1.08); } 100% { transform: scale(.8); } }
.break-cards { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; width: 100%; }
.bcard { flex: 1 1 240px; max-width: 360px; display: flex; gap: 12px; align-items: center; padding: 14px 16px; border-radius: var(--r-md); background: var(--card); border: 1px solid var(--line); font-size: 14px; color: var(--text2); }
.bcard svg { color: var(--accent); }
.bcard b { color: var(--text); font-weight: 600; }

.opts { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 10px 18px; min-height: 40px; }
.chips.center { justify-content: center; }
.sess-info { display: flex; align-items: center; gap: 7px; font-weight: 600; color: var(--text2); font-size: 14.5px; }
.sess-info svg { color: var(--accent); }
.hint { font-size: 13px; color: var(--text3); text-align: center; max-width: 440px; min-height: 18px; }
.ctl { display: flex; gap: 12px; justify-content: center; padding-top: 4px; }
.btn.big { height: 56px; padding: 0 30px; border-radius: 28px; font-size: 17px; min-width: 150px; }

/* mini timer shown in the top bar on other screens */
.pill.mini { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.pill.mini svg { color: inherit; }

/* full-screen clock */
body.zen .rail, body.zen .topbar, body.zen .todo { display: none; }
body.zen .app { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); }
body.zen .focus-grid { grid-template-columns: minmax(0, 1fr); }
body.zen .view { padding-top: calc(18px + var(--sat)); }
body.zen .clock { --cs: min(100cqh, 100cqw, 760px); }
body.zen .brand-fixed { display: flex; }
body.zen .view { padding-top: calc(60px + var(--sat)); }
body.zen .hint { display: none; }

@media (orientation: portrait), (max-width: 860px) {
  .focus-grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1.5fr) minmax(0, 1fr); gap: 18px; }
  .focus-grid .stage { grid-row: 1; }
  .focus-grid .todo { grid-row: 2; }
  body.zen .focus-grid { grid-template-rows: minmax(0, 1fr); }
}
@media (max-height: 700px) {
  .hint { display: none; }
  .btn.big { height: 48px; }
}

/* ---------- shared view pieces ---------- */
.toolbar { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 16px; min-height: 40px; }
.nav { display: inline-flex; align-items: center; gap: 2px; }
.nav-l { min-width: 150px; text-align: center; font-size: 16px; font-weight: 650; padding: 0 6px; }
.statline { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; margin-bottom: 16px; }
.statline > div { background: var(--card); border: 1px solid var(--line); border-radius: var(--r-md); padding: 14px 18px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.statline b { font-size: 24px; font-weight: 650; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.statline span { font-size: 13px; color: var(--text2); }
.bar.thick { height: 10px; border-radius: 5px; }
.bar.thick > i { border-radius: 5px; }
.tile-ic { width: 40px; height: 40px; border-radius: 13px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; flex: none; }
.tile-ic.off { background: var(--card2); color: var(--text3); }
.mini-task { display: flex; align-items: flex-start; gap: 8px; padding: 5px 0; font-size: 13.5px; line-height: 1.3; width: 100%; min-width: 0; }
.mini-task span { overflow-wrap: anywhere; min-width: 0; }
.mini-task.done span { color: var(--text3); text-decoration: line-through; }
.mini-task em { font-style: normal; color: var(--text3); font-size: 12px; }
.mt-c { width: 16px; height: 16px; border-radius: 50%; border: 1.5px solid var(--line2); flex: none; display: grid; place-items: center; margin-top: 1px; color: var(--accent-ink); }
.mini-task.done .mt-c { background: var(--accent); border-color: var(--accent); }
.mt-c.flag { border: 0; color: var(--accent); }
.legend { display: flex; align-items: center; gap: 6px 14px; flex-wrap: wrap; font-size: 12.5px; color: var(--text2); }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend .dash { width: 16px; border-top: 2px dashed var(--text3); display: inline-block; }
.warn { color: var(--warn); } .tagline.bad { color: var(--bad); font-weight: 600; }

/* ---------- Home ---------- */
.home { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; }
.home > * { grid-column: span 4; }
.home > .hero { grid-column: span 7; display: flex; align-items: center; gap: 30px; padding: 26px 30px; }
.home > .next { grid-column: span 5; display: flex; flex-direction: column; }
.home > .tile { grid-column: span 3; }
.home > .notice { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 16px 20px; border-color: var(--accent); flex-wrap: wrap; }
.notice b { font-size: 16px; font-weight: 650; }
.notice .grow { flex: 1 1 260px; }
.notice.bad { border-color: var(--bad); }
.notice.bad .tile-ic { background: color-mix(in srgb, var(--bad) 16%, transparent); color: var(--bad); }
.hero-ring { position: relative; flex: none; width: 208px; height: 208px; }
.hero-mid { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.hero-mid b { font-size: 38px; font-weight: 300; letter-spacing: -.03em; line-height: 1.05; }
.hero-mid span { color: var(--text2); font-size: 14px; }
.hero-side { flex: 1; min-width: 0; }
.hero-side h3 { font-size: 20px; font-weight: 700; letter-spacing: -.015em; margin-bottom: 16px; }
.areas { display: grid; gap: 13px; }
.ar .row { margin-bottom: 6px; font-size: 14.5px; font-weight: 550; }
.next-title { font-size: 24px; font-weight: 650; letter-spacing: -.02em; line-height: 1.2; margin-bottom: 10px; overflow-wrap: anywhere; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.next-foot { margin-top: auto; padding-top: 18px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.tile { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; padding: 18px 20px; text-align: left; }
.tile-n { font-size: 26px; font-weight: 650; letter-spacing: -.02em; margin-top: 10px; line-height: 1.1; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-n small { font-size: 15px; font-weight: 500; color: var(--text2); letter-spacing: 0; }
.tile-s { font-size: 13px; color: var(--text2); max-width: 100%; }
.tile-x { font-size: 12.5px; color: var(--text3); display: inline-flex; gap: 5px; align-items: center; margin-top: 2px; }
.tile .bar { width: 100%; margin-top: 8px; }
.tgt { margin-bottom: 14px; } .tgt .row { margin-bottom: 7px; font-size: 14.5px; }
.wk { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; margin-top: 18px; }
.wk-d { display: flex; flex-direction: column; align-items: center; gap: 5px; }
.wk-bar { width: 100%; max-width: 30px; height: 54px; border-radius: 7px; background: var(--card2); display: flex; align-items: flex-end; overflow: hidden; }
.wk-bar i { width: 100%; background: var(--accent); border-radius: 7px 7px 0 0; min-height: 0; }
.wk-d.future .wk-bar { opacity: .5; }
.wk-l { font-size: 12px; font-weight: 600; color: var(--text3); }
.wk-d.today .wk-l { color: var(--accent); }
.wk-m { height: 12px; color: var(--accent); }
.report { display: flex; gap: 22px; align-items: center; }
.grade { flex: none; width: 104px; height: 104px; border-radius: 28px; background: var(--accent-soft); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; }
.grade b { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1; color: var(--accent); }
.grade span { font-size: 12px; color: var(--text2); }
.report-parts { flex: 1; min-width: 0; display: grid; gap: 10px; }
.rp .row { font-size: 13.5px; margin-bottom: 5px; }

/* ---------- Tasks ---------- */
.tk-day { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
.tk-week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: start; }
.wkcol { padding: 14px 13px; border-radius: var(--r-md); }
.wkcol.today { border-color: var(--accent); }
.wkcol-h { width: 100%; display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 9px; font-size: 14px; }
.wkcol-h span { color: var(--text2); font-size: 13px; }
.wkcol-list { margin-top: 10px; min-height: 60px; }
.wkcol-f { margin-top: 10px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--text2); }
.mgrid, .cgrid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; }
.mhead { font-size: 12.5px; font-weight: 600; color: var(--text3); text-align: center; padding: 2px 0 6px; }
.mcell { min-height: 84px; border-radius: 14px; background: var(--card2); padding: 9px 10px; display: flex; flex-direction: column; gap: 3px; text-align: left; }
.mcell.blank, .ccell.blank { background: none; }
.mcell.today { box-shadow: inset 0 0 0 1.5px var(--accent); }
.mc-d { font-size: 13px; font-weight: 600; color: var(--text2); }
.mc-n { font-size: 20px; font-weight: 650; margin-top: auto; letter-spacing: -.02em; }
.mc-n small { font-size: 13px; font-weight: 500; color: var(--text3); }
.mcell .bar { background: var(--line); height: 4px; }

/* ---------- Calendar ---------- */
.cal { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
.cal-side { display: grid; gap: 18px; }
.ccell { min-height: 92px; border-radius: 14px; background: var(--card2); padding: 9px 10px 8px; display: flex; flex-direction: column; text-align: left; min-width: 0; position: relative; }
.ccell.l1 { background: color-mix(in srgb, var(--accent) 12%, var(--card2)); }
.ccell.l2 { background: color-mix(in srgb, var(--accent) 22%, var(--card2)); }
.ccell.l3 { background: color-mix(in srgb, var(--accent) 34%, var(--card2)); }
.ccell.l4 { background: color-mix(in srgb, var(--accent) 48%, var(--card2)); }
.ccell.today .cc-d { background: var(--accent); color: var(--accent-ink); }
.ccell.sel { box-shadow: inset 0 0 0 2px var(--text); }
.cc-top { display: flex; align-items: center; justify-content: space-between; }
.cc-d { font-size: 13px; font-weight: 650; min-width: 24px; height: 24px; border-radius: 12px; display: inline-grid; place-items: center; margin: -2px 0 0 -4px; padding: 0 5px; }
.cc-ic { display: inline-flex; gap: 2px; color: var(--text); }
.cc-h { font-size: 19px; font-weight: 600; letter-spacing: -.02em; margin-top: auto; min-height: 24px; }
.cc-ev { font-size: 11.5px; color: var(--text2); display: flex; align-items: center; gap: 4px; min-height: 15px; }
.lg { width: 16px; height: 16px; border-radius: 5px; background: var(--card2); display: inline-block; border: 1px solid var(--line); }
.lg.l1 { background: color-mix(in srgb, var(--accent) 12%, var(--card2)); } .lg.l2 { background: color-mix(in srgb, var(--accent) 22%, var(--card2)); }
.lg.l3 { background: color-mix(in srgb, var(--accent) 34%, var(--card2)); } .lg.l4 { background: color-mix(in srgb, var(--accent) 48%, var(--card2)); }
.legend.keys { margin-top: 16px; }
.cd { display: flex; align-items: center; gap: 14px; width: 100%; padding: 6px 0; text-align: left; }
.cd b { font-size: 30px; font-weight: 300; letter-spacing: -.03em; min-width: 58px; color: var(--accent); }
.cd .grow { display: flex; flex-direction: column; font-weight: 600; }
.cd .small { font-weight: 400; }
.sess { display: flex; gap: 11px; align-items: stretch; width: 100%; padding: 8px 0; text-align: left; }
.sess-t { font-size: 12px; color: var(--text2); line-height: 1.5; flex: none; width: 62px; text-align: right; }
.sess-bar { width: 4px; border-radius: 2px; flex: none; }
.sess-m { display: flex; flex-direction: column; gap: 1px; }
.sess-m .row { gap: 8px; }

/* ---------- Stats ---------- */
.stats, .troph { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
.span2 { grid-column: 1 / -1; }
.chart { display: flex; gap: 10px; height: 250px; padding-top: 6px; }
.yax { display: flex; flex-direction: column; justify-content: space-between; font-size: 11.5px; color: var(--text3); text-align: right; margin-bottom: 24px; min-width: 30px; }
.yax span { line-height: 1; transform: translateY(-50%); } .yax span:last-child { transform: translateY(50%); }
.plot { flex: 1; position: relative; margin-bottom: 24px; border-bottom: 1px solid var(--line2); min-width: 0; }
.plot .grid { position: absolute; left: 0; right: 0; border-top: 1px solid var(--line); }
.plot .tline { position: absolute; left: 0; right: 0; border-top: 2px dashed var(--text3); z-index: 2; pointer-events: none; }
.bcols { position: absolute; inset: 0; display: flex; gap: 14px; padding: 0 8px; }
.bcols.n30 { gap: 4px; padding: 0 2px; } .bcols.n12 { gap: 12px; }
.bcol { flex: 1; position: relative; min-width: 0; display: block; }
.bcol.sel::before { content: ""; position: absolute; inset: 0 -3px; background: var(--card2); border-radius: 8px 8px 0 0; }
.bstack { position: absolute; inset: 0; display: flex; flex-direction: column-reverse; align-items: center; gap: 2px; }
.bstack i { width: 100%; max-width: 40px; flex: none; min-height: 2px; }
.bstack i:last-child { border-radius: 4px 4px 0 0; }
.blab { position: absolute; top: 100%; left: 50%; transform: translateX(-50%); padding-top: 7px; font-size: 11.5px; color: var(--text3); white-space: nowrap; }
.readout { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px; min-height: 26px; margin-top: 10px; font-size: 13.5px; color: var(--text2); }
.readout b { color: var(--text); font-weight: 650; }
.readout span { display: inline-flex; align-items: center; gap: 6px; }
.split { display: flex; gap: 2px; height: 14px; border-radius: 4px; overflow: hidden; margin-bottom: 14px; }
.split i { min-width: 3px; }
.tbl .row { padding: 7px 0; font-size: 14.5px; }
.tbl .pct { width: 42px; text-align: right; }
.toprow { margin-bottom: 11px; font-size: 14px; } .toprow .row { margin-bottom: 5px; }
.hours { display: flex; align-items: flex-end; gap: 3px; height: 140px; border-bottom: 1px solid var(--line2); }
.hcol { flex: 1; height: 100%; display: flex; align-items: flex-end; min-width: 0; border-radius: 6px 6px 0 0; }
.hcol i { width: 100%; background: var(--text3); border-radius: 4px 4px 0 0; min-height: 2px; opacity: .55; }
.hcol.best i { background: var(--accent); opacity: 1; }
.hcol.sel { background: var(--card2); }
.hax { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--text3); padding-top: 7px; }
.recs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px 18px; }
.rec { display: flex; gap: 12px; align-items: flex-start; min-width: 0; }
.rec .grow { display: flex; flex-direction: column; }
.rec b { font-size: 20px; font-weight: 650; letter-spacing: -.02em; }

/* ---------- Trophies ---------- */
.emblem { width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center; flex: none; color: var(--accent-ink); background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--accent) 70%, #fff), var(--accent) 60%, color-mix(in srgb, var(--accent) 70%, #000)); box-shadow: 0 0 0 4px var(--accent-soft); }
.emblem.xl { width: 108px; height: 108px; box-shadow: 0 0 0 7px var(--accent-soft); }
.emblem.big { width: 170px; height: 170px; box-shadow: 0 0 0 10px var(--accent-soft), 0 0 80px var(--accent-soft); }
.rank-hero { display: flex; align-items: center; gap: 26px; padding: 26px 28px; }
.rank-hero h2 { font-size: 36px; font-weight: 700; letter-spacing: -.03em; margin: 2px 0 14px; }
.streak { padding: 24px 26px; display: grid; gap: 16px; }
.flame { color: var(--accent); } .flame.off { color: var(--text3); }
.streak .big { font-size: 36px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.streak .big small { font-size: 17px; font-weight: 500; color: var(--text2); letter-spacing: 0; }
.sdots { display: grid; grid-template-columns: repeat(14, 1fr); gap: 6px; }
.sd { aspect-ratio: 1; max-height: 26px; border-radius: 8px; background: var(--card2); display: grid; place-items: center; color: var(--text2); }
.sd.on { background: var(--accent); } .sd.frz { background: var(--line2); } .sd.today { box-shadow: 0 0 0 2px var(--line2); }
.streak .row svg { display: inline-block; vertical-align: -2px; margin-right: 4px; }
.ladder { display: flex; gap: 0; overflow-x: auto; padding: 4px 0 6px; -webkit-overflow-scrolling: touch; }
.step { flex: 1 0 96px; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; text-align: center; padding: 0 4px; min-width: 0; }
.step::before { content: ""; position: absolute; top: 15px; left: -50%; right: 50%; height: 3px; background: var(--card2); }
.step:first-child::before { display: none; }
.step.done::before, .step.cur::before { background: var(--accent); }
.step i { width: 32px; height: 32px; border-radius: 50%; background: var(--card2); display: grid; place-items: center; position: relative; color: var(--accent-ink); border: 3px solid var(--card); box-sizing: content-box; margin: -3px; }
.step.done i, .step.cur i { background: var(--accent); }
.step.cur i { box-shadow: 0 0 0 4px var(--accent-soft); }
.step b { font-size: 13.5px; max-width: 100%; margin-top: 4px; color: var(--text3); font-weight: 600; }
.step.done b, .step.cur b { color: var(--text); }
.step span { font-size: 11.5px; color: var(--text3); }
.shelves { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); }
.trophy { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 18px 8px 16px; text-align: center; border-bottom: 3px solid var(--card2); position: relative; min-width: 0; }
.trophy svg { filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .35)); margin-bottom: 6px; }
.trophy.locked svg { filter: none; }
.trophy b { font-size: 13.5px; font-weight: 600; line-height: 1.2; }
.trophy.locked b { color: var(--text3); }
.trophy .bar { width: 64px; height: 4px; margin-top: 3px; }
.badges { display: grid; grid-template-columns: repeat(auto-fill, minmax(112px, 1fr)); gap: 18px 8px; }
.badge { display: flex; flex-direction: column; align-items: center; gap: 9px; text-align: center; min-width: 0; }
.badge b { font-size: 12.5px; font-weight: 600; line-height: 1.2; }
.badge-disc { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; color: var(--accent-ink); background: radial-gradient(circle at 30% 25%, color-mix(in srgb, var(--accent) 65%, #fff), var(--accent) 62%, color-mix(in srgb, var(--accent) 72%, #000)); box-shadow: 0 0 0 4px var(--accent-soft); }
.badge.locked .badge-disc, .badge-disc.locked { background: var(--card2); color: var(--text3); box-shadow: inset 0 0 0 1.5px var(--line2); }
.badge.locked b { color: var(--text3); }
.badge-disc.big { width: 150px; height: 150px; box-shadow: 0 0 0 9px var(--accent-soft); }
.badge-disc.cold { background: radial-gradient(circle at 30% 25%, #EAF6FF, #6E9BC0 70%); color: #06263F; box-shadow: 0 0 0 9px rgba(110, 155, 192, .2); }
.ach-detail { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding-top: 0; }

/* ---------- Revise ---------- */
.revs { display: grid; gap: 18px; }

/* ---------- Settings ---------- */
.setup { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 26px; align-items: start; }
.set-nav { display: flex; flex-direction: column; gap: 2px; position: sticky; top: 0; }
.set-nav button { height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 600; color: var(--text2); font-size: 15px; white-space: nowrap; }
.set-nav button.on { background: var(--card); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.set-body { display: grid; gap: 18px; max-width: 860px; justify-items: stretch; }
.set-body > .btn { justify-self: start; }
.set-row { display: flex; align-items: center; gap: 18px; padding: 13px 0; border-bottom: 1px solid var(--line); min-height: 58px; }
.set-row:last-of-type { border-bottom: 0; }
.set-row b { font-weight: 600; font-size: 15.5px; display: inline-flex; align-items: center; }
.unit-row { gap: 8px; flex: none; }
.unit { color: var(--text2); font-size: 14px; min-width: 36px; }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { width: 34px; height: 34px; border-radius: 50%; position: relative; flex: none; }
.swatch.on::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 2.5px solid var(--text); }
.swatches.sm .swatch { width: 26px; height: 26px; } .swatches.sm { gap: 9px; }
.sw-gold { background: #D4AF63; } .sw-silver { background: linear-gradient(135deg, #F2F2F5, #8E8E96); } .sw-blue { background: #0A84FF; } .sw-green { background: #30D158; }
.sw-orange { background: #FF9F0A; } .sw-purple { background: #BF5AF2; } .sw-pink { background: #FF375F; }
.range { width: 220px; accent-color: var(--accent); }
.ptable { display: grid; gap: 8px; }
.phead, .prow { display: grid; grid-template-columns: minmax(110px, 1fr) repeat(4, auto) 40px; gap: 10px; align-items: center; }
.phead { font-size: 12.5px; color: var(--text3); font-weight: 600; }
.phead span:nth-child(n+2) { width: 132px; }
.prow .num-in { width: 76px; } .prow .unit { min-width: 48px; }
.ptable.ranks .prow { grid-template-columns: 22px minmax(120px, 1fr) auto 40px; }
.area-name { width: 220px; font-weight: 650; font-size: 16px; }
.subs { display: grid; gap: 14px; margin-top: 16px; }
.sub { padding: 12px 14px; border-radius: var(--r-md); background: var(--bg); border: 1px solid var(--line); }
.sub > .row .input { font-weight: 600; background: transparent; padding-left: 4px; }
.topics { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; align-items: center; }
.topic { display: inline-flex; align-items: center; height: 34px; border-radius: 17px; background: var(--card2); padding: 0 6px 0 13px; max-width: 100%; }
.topic input { background: none; border: 0; outline: 0; font-size: 14px; min-width: 40px; max-width: 100%; }
.topic button { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: var(--text3); flex: none; }
.add-in { height: 36px; border-radius: 18px; width: 220px; font-size: 14px; background: transparent; border: 1px dashed var(--line2); }
.subs > .add-in { width: 280px; }

/* ---------- dialogs ---------- */
.modal.narrow { width: min(430px, 100%); }
.tp-grid { display: grid; grid-template-columns: .8fr 1fr 1.2fr; gap: 16px; min-height: 300px; }
.tp-col { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.tp-col .label { margin-bottom: 4px; }
.tp-item { height: 42px; padding: 0 13px; border-radius: 12px; display: flex; align-items: center; gap: 9px; font-weight: 550; font-size: 15px; min-width: 0; flex: none; }
.tp-item.on { background: var(--accent-soft); color: var(--accent); }
.tp-col .input { height: 40px; margin-top: 4px; background: transparent; border: 1px dashed var(--line2); font-size: 14px; flex: none; }
.tp-open { display: flex; align-items: center; gap: 9px; text-align: left; }
.pad-list, .plan-list { margin-top: 8px; min-height: 60px; }
.plan-list .task { gap: 8px; }
.rate { display: flex; gap: 6px; }
.rate button { color: var(--line2); transition: transform .12s, color .12s; padding: 2px; }
.rate button.on { color: var(--accent); }
.rate button:active { transform: scale(1.18); }
.xp-stage { padding: 34px 28px 6px; text-align: center; }
.xp-big { font-size: 76px; font-weight: 200; letter-spacing: -.04em; line-height: 1; color: var(--accent); }
.xp-unit { color: var(--text2); font-weight: 600; margin-top: 6px; }
.xp-gains { margin: 24px 0 20px; display: grid; gap: 8px; text-align: left; font-size: 14.5px; color: var(--text2); }
.xp-gains b { color: var(--text); }
.xp-rank { display: flex; gap: 16px; align-items: center; text-align: left; padding: 16px 18px; background: var(--card2); border-radius: var(--r-md); }

/* ---------- full-screen moments ---------- */
.moment { position: fixed; inset: 0; z-index: 70; display: grid; place-items: center; background: rgba(0, 0, 0, .78); -webkit-backdrop-filter: blur(22px); backdrop-filter: blur(22px); opacity: 0; transition: opacity .3s; color: #F5F5F7; padding: 24px; }
.moment.in { opacity: 1; }
.moment.big { background: radial-gradient(circle at 50% 40%, color-mix(in srgb, var(--accent) 30%, #000) 0%, rgba(0, 0, 0, .93) 62%); }
.moment .confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.moment-in { position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; max-width: 460px; }
.moment-art { margin-bottom: 22px; transform: scale(.5); opacity: 0; transition: transform .7s cubic-bezier(.2, 1.4, .3, 1) .1s, opacity .4s .1s; }
.moment.in .moment-art { transform: none; opacity: 1; }
.moment-art svg { filter: drop-shadow(0 24px 40px rgba(0, 0, 0, .6)); }
.moment-art .badge-disc svg, .moment-art .emblem svg { filter: none; }
.moment-k { font-size: 15px; font-weight: 650; color: var(--accent); }
.moment h2 { font-size: 40px; font-weight: 700; letter-spacing: -.03em; line-height: 1.1; }
.moment p { color: rgba(235, 235, 245, .7); font-size: 16px; margin-bottom: 24px; }
.moment .btn { min-width: 170px; height: 50px; border-radius: 25px; }

/* ---------- portrait and narrow ---------- */
@media (orientation: portrait), (max-width: 1100px) {
  .home > * { grid-column: span 6; }
  .home > .hero, .home > .next, .home > .notice { grid-column: 1 / -1; }
  .home > .tile { grid-column: span 6; }
  .tk-day { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tk-week { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .cal { grid-template-columns: minmax(0, 1fr); }
  .cal-side { grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); align-items: start; }
  .recs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .setup { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .set-nav { flex-direction: row; overflow-x: auto; position: static; padding-bottom: 4px; -webkit-overflow-scrolling: touch; }
  .set-nav button { flex: none; height: 38px; }
}
@media (max-width: 720px) {
  .home > *, .home > .tile { grid-column: 1 / -1; }
  .home > .hero { flex-direction: column; align-items: stretch; }
  .hero-ring { align-self: center; }
  .statline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .stats, .troph, .tk-day { grid-template-columns: minmax(0, 1fr); }
  .tk-week { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tp-grid { grid-template-columns: minmax(0, 1fr); }
  .ccell { min-height: 64px; padding: 6px; } .cc-h { font-size: 13px; } .cc-ev { display: none; }
  .phead { display: none; } .prow { grid-template-columns: 1fr 1fr; }
  .set-row { flex-wrap: wrap; }
  .report { flex-direction: column; align-items: stretch; } .grade { width: 100%; height: 84px; flex-direction: row; gap: 14px; }
  .rev { flex-wrap: wrap; }
}

@media (max-width: 560px) {
  .tb-sub { display: none; }
  .view.fixed { overflow-y: auto; display: block; }
  .focus-grid { display: flex; flex-direction: column; gap: 16px; }
  .focus-grid .stage { order: 1; }
  .focus-grid .todo { order: 2; }
  .todo-list { overflow: visible; }
  .clock-wrap { flex: none; height: min(78vw, 340px); }
  .stage-top { flex-wrap: wrap; }
  .stage-top .seg button { padding: 0 11px; }
  .set-row > .grow { flex: 1 1 220px; }
  .cal-side { grid-template-columns: minmax(0, 1fr); }
  .rank-hero { flex-direction: column; align-items: flex-start; }
  .toolbar .nav-l { min-width: 0; }
  body.zen .view.fixed { display: flex; overflow: hidden; }
  body.zen .focus-grid { flex: 1; }
  body.zen .clock-wrap { flex: 1; height: auto; }
}

/* ---------- motion: plays once when you open a screen ---------- */
@keyframes rise { from { opacity: 0; transform: translateY(16px); } }
@keyframes growx { from { transform: scaleX(0); } }
@keyframes growy { from { transform: scaleY(0); } }
@keyframes ringdraw { from { stroke-dashoffset: var(--c); } }
@keyframes pop { 0% { transform: scale(.7); } 60% { transform: scale(1.13); } 100% { transform: none; } }
@keyframes spark { 0% { opacity: 1; transform: rotate(var(--a)) translateY(-10px) scale(1); } 100% { opacity: 0; transform: rotate(var(--a)) translateY(var(--dist, -48px)) scale(.3); } }
.view.enter > *:not(.stag):not(.goals), .view.enter > .stag > *, .view.enter > .goals > .g-hero { animation: rise .5s cubic-bezier(.2, .8, .2, 1) both; }
.view.enter > *:nth-child(2):not(.stag) { animation-delay: .05s; }
.view.enter > *:nth-child(3):not(.stag) { animation-delay: .1s; }
.view.enter > .stag > *:nth-child(2) { animation-delay: .04s; } .view.enter > .stag > *:nth-child(3) { animation-delay: .08s; }
.view.enter > .stag > *:nth-child(4) { animation-delay: .12s; } .view.enter > .stag > *:nth-child(5) { animation-delay: .16s; }
.view.enter > .stag > *:nth-child(6) { animation-delay: .2s; } .view.enter > .stag > *:nth-child(7) { animation-delay: .24s; }
.view.enter > .stag > *:nth-child(8) { animation-delay: .28s; } .view.enter > .stag > *:nth-child(9) { animation-delay: .32s; }
.view.enter > .stag > *:nth-child(n+10) { animation-delay: .36s; }
.view.enter .bar > i, .view.enter .split { transform-origin: left; animation: growx .9s cubic-bezier(.2, .8, .2, 1) .2s both; }
.view.enter .ring-prog { animation: ringdraw 1.2s cubic-bezier(.3, .7, .2, 1) .2s both; }
.view.enter .wk-bar i, .view.enter .hw-bar i, .view.enter .bstack, .view.enter .hcol i, .view.enter .cap { transform-origin: bottom; animation: growy .8s cubic-bezier(.2, .8, .2, 1) .25s both; }

/* dark overlays always use the bright accent, even in the light theme */
.ondark { --accent: #DDB96F; --accent-ink: #1B1404; --accent-soft: rgba(221, 185, 111, .15); }
:root[data-accent="blue"] .ondark { --accent: #2997FF; --accent-ink: #00101F; --accent-soft: rgba(41, 151, 255, .16); }
:root[data-accent="green"] .ondark { --accent: #30D158; --accent-ink: #03200C; --accent-soft: rgba(48, 209, 88, .15); }
:root[data-accent="orange"] .ondark { --accent: #FF9F0A; --accent-ink: #211300; --accent-soft: rgba(255, 159, 10, .15); }
:root[data-accent="purple"] .ondark { --accent: #BF5AF2; --accent-ink: #1A0526; --accent-soft: rgba(191, 90, 242, .16); }
:root[data-accent="pink"] .ondark { --accent: #FF4F79; --accent-ink: #26000C; --accent-soft: rgba(255, 79, 121, .16); }
:root[data-accent="silver"] .ondark { --accent: #E8E8ED; --accent-ink: #000; --accent-soft: rgba(232, 232, 237, .13); }

/* polish */
:root[data-theme="dark"] .card { background: linear-gradient(180deg, rgba(255, 255, 255, .03), rgba(255, 255, 255, 0) 46%), var(--card); }
.rail { overflow-y: auto; scrollbar-width: none; gap: 2px; }

.rail-btn.on .count.soft { background: var(--accent); color: var(--accent-ink); box-shadow: none; }
.hero-mid b small { font-size: .5em; color: var(--text3); font-weight: 400; letter-spacing: 0; }
.sparks { position: absolute; inset: 0; pointer-events: none; }
.sparks b { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: var(--hc, var(--accent)); opacity: 0; }
.sparks b:nth-child(1) { --a: 0deg; } .sparks b:nth-child(2) { --a: 45deg; } .sparks b:nth-child(3) { --a: 90deg; } .sparks b:nth-child(4) { --a: 135deg; }
.sparks b:nth-child(5) { --a: 180deg; } .sparks b:nth-child(6) { --a: 225deg; } .sparks b:nth-child(7) { --a: 270deg; } .sparks b:nth-child(8) { --a: 315deg; }
.sparks.big b:nth-child(n) { width: 8px; height: 8px; }
.sparks.big b:nth-child(9) { --a: 22deg; } .sparks.big b:nth-child(10) { --a: 112deg; } .sparks.big b:nth-child(11) { --a: 202deg; } .sparks.big b:nth-child(12) { --a: 292deg; }
.burst .sparks b { animation: spark .6s ease-out both; }
.win .sparks b { --dist: -130px; animation: spark 1s ease-out both; }

/* Home tiles: icon, one figure, one label */
.tile { flex-direction: row; align-items: center; gap: 14px; flex-wrap: wrap; padding: 18px 20px; }
.tile-t { display: flex; flex-direction: column; gap: 1px; min-width: 0; flex: 1; }

.home > .hh { grid-column: span 7; }
.home > .hg-card { grid-column: span 5; }

/* ---------- Habits ---------- */
.habits { display: grid; gap: 14px; }
.hb-hero { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 40px; align-items: center; padding: 24px 32px; }
.hb-ringwrap { position: relative; width: 176px; height: 176px; }

.hb-allok { color: var(--accent); }
.hb-week .label { margin-bottom: 12px; }
.hw-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; height: 124px; }
.hw { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }

.hw.today .hw-l { color: var(--accent); }
.hb-figs { display: grid; gap: 16px; }
.fig { display: grid; grid-template-columns: auto auto; column-gap: 13px; align-items: center; justify-content: start; }

.fig b { font-size: 25px; font-weight: 650; letter-spacing: -.02em; line-height: 1.1; }
.fig span:last-child { font-size: 12.5px; color: var(--text2); }
.hb { display: grid; grid-template-columns: auto minmax(170px, 1fr) auto auto; gap: 22px; align-items: center; padding: 14px 24px 14px 16px; }
.hb-check, .hh-disc { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; position: relative; color: var(--hc); background: color-mix(in srgb, var(--hc) 14%, transparent); box-shadow: inset 0 0 0 2px color-mix(in srgb, var(--hc) 46%, transparent); transition: transform .15s, background .25s, box-shadow .25s; flex: none; }
.hb-check.on, .hh-item.on .hh-disc { background: var(--hc); color: #fff; box-shadow: 0 8px 22px color-mix(in srgb, var(--hc) 42%, transparent); }
.hb-check:active, .hh-item:active .hh-disc { transform: scale(.92); }
.hb-check.burst, .hh-item.burst .hh-disc, .cap.burst, .hb-fire.bump { animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
.hb-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; text-align: left; }
.hb-name { font-size: 18px; font-weight: 650; letter-spacing: -.012em; }
.hb.done .hb-name { color: var(--text2); }
.hb-meta { display: flex; align-items: center; gap: 12px; font-size: 13px; }
.hb-fire { display: inline-flex; align-items: center; gap: 4px; color: var(--hc); font-weight: 700; }

.hb-strip { display: flex; gap: 3px; align-items: center; }
.cap { width: 13px; height: 34px; border-radius: 7px; background: var(--card2); flex: none; transition: background .2s; }
.cap.on { background: var(--hc); }
.cap.miss { box-shadow: inset 0 0 0 1px var(--line2); }
.cap.off { opacity: .4; }
.cap.today { height: 46px; margin-left: 3px; }
.hb-rate { position: relative; width: 54px; height: 54px; display: grid; place-items: center; flex: none; }
.hb-rate svg { position: absolute; inset: 0; }
.hb-rate b { font-size: 13px; font-weight: 700; } .hb-rate small { font-size: 9px; font-weight: 600; color: var(--text3); }
.hb-add { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; padding-top: 6px; }
.hb-empty { text-align: center; padding: 54px 24px; display: flex; flex-direction: column; align-items: center; }

.hb-empty-art { display: flex; gap: 14px; margin-bottom: 26px; }

.hb-empty-art span:nth-child(2) { animation-delay: -1s; } .hb-empty-art span:nth-child(3) { animation-delay: -2s; } .hb-empty-art span:nth-child(4) { animation-delay: -3s; }
@keyframes floaty { from { transform: translateY(5px); } to { transform: translateY(-7px); } }
.hb-disc { width: 50px; height: 50px; border-radius: 50%; background: var(--hc); color: #fff; display: grid; place-items: center; flex: none; }
.icon-grid { display: grid; grid-template-columns: repeat(9, minmax(0, 1fr)); gap: 8px; }
.icon-grid button { aspect-ratio: 1; border-radius: 13px; background: var(--card2); display: grid; place-items: center; color: var(--text2); }
.icon-grid button.on { background: var(--hc); color: #fff; }
.daypick { display: flex; gap: 7px; flex-wrap: wrap; }
.daypick button { min-width: 54px; height: 38px; padding: 0 10px; border-radius: 19px; background: var(--card2); font-weight: 650; font-size: 13.5px; color: var(--text3); flex: none; text-align: center; }
.daypick button.on { background: var(--accent); color: var(--accent-ink); }
.modal .statline { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.modal .statline > div { background: var(--card2); border: 0; padding: 12px 14px; }
.modal .statline b { font-size: 22px; }
.hm-wrap { overflow-x: auto; padding-bottom: 4px; }
.hm-grid, .hm-months { display: flex; gap: 3px; }
.hm-col { display: grid; gap: 3px; }
.hm { width: 18px; height: 18px; border-radius: 5px; box-shadow: inset 0 0 0 1px var(--line); display: block; }
.hm.miss { background: var(--card2); box-shadow: none; } .hm.on { background: var(--hc); box-shadow: none; } .hm.fut { opacity: .3; }

.wd-row { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; height: 128px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.wd-bar { flex: 1; width: 100%; max-width: 46px; border-radius: 9px; background: var(--card2); display: flex; align-items: flex-end; overflow: hidden; }
.wd-bar i { width: 100%; background: var(--hc); border-radius: 9px; }
/* habits on Home */
.hh-row { display: flex; gap: 12px; overflow-x: auto; padding: 4px 2px 2px; scrollbar-width: none; }
.hh-item { display: flex; flex-direction: column; align-items: center; gap: 7px; width: 82px; flex: none; }
.hh-disc { width: 58px; height: 58px; }
.hh-name { font-size: 12.5px; font-weight: 600; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
