/* ---------- Goals ---------- */
.goals { display: grid; gap: 18px; }
.g-hero { position: relative; border-radius: 32px; overflow: hidden; border: 1px solid var(--line); background: var(--card); padding: 22px 36px 36px; isolation: isolate; }
.aurora { position: absolute; inset: 0; z-index: -1; overflow: hidden; }
.aurora i { position: absolute; width: 56%; aspect-ratio: 1; border-radius: 50%; filter: blur(72px); background: var(--accent); opacity: .3; animation: drift 16s ease-in-out infinite alternate; }
.aurora i:nth-child(1) { left: -14%; top: -62%; }
.aurora i:nth-child(2) { right: -12%; bottom: -80%; opacity: .2; animation-duration: 21s; background: color-mix(in srgb, var(--accent) 55%, #7B6CFF); }
.aurora i:nth-child(3) { left: 36%; top: 6%; width: 28%; opacity: .1; animation-duration: 26s; }
:root[data-theme="light"] .aurora i { opacity: .16; }
@keyframes drift { from { transform: translate(0, 0) scale(1); } to { transform: translate(14%, 12%) scale(1.28); } }
.g-tabs { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 24px; scrollbar-width: none; }
.g-tabs .chip { max-width: 250px; background: color-mix(in srgb, var(--card) 55%, transparent); }
.g-tabs .chip.on { background: var(--accent); color: var(--accent-ink); }
.g-hero-in { display: flex; align-items: center; gap: 44px; }
.g-text { flex: 1; min-width: 0; }
.g-k { display: inline-flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 650; color: var(--accent); }
.g-title { font-size: clamp(32px, 4.5vw, 60px); font-weight: 700; letter-spacing: -.035em; line-height: 1.04; margin-top: 10px; text-wrap: balance; overflow-wrap: anywhere; }
.g-why { font-size: 18px; color: var(--text2); margin-top: 14px; max-width: 34em; line-height: 1.42; }
.g-facts { display: flex; gap: 40px; margin-top: 26px; flex-wrap: wrap; }
.g-facts b { display: block; font-size: 36px; font-weight: 300; letter-spacing: -.03em; line-height: 1.1; }
.g-facts b.sm { font-size: 24px; font-weight: 400; padding-top: 9px; }
.g-facts b small { font-size: .55em; color: var(--text3); }
.g-facts span { font-size: 13px; color: var(--text2); }
.g-acts { margin-top: 24px; flex-wrap: wrap; }
.g-acts .btn { background: color-mix(in srgb, var(--card2) 70%, transparent); }
.g-ring { position: relative; width: 232px; height: 232px; flex: none; }
.g-ring svg, .hb-ringwrap svg { overflow: visible; }
.g-ring .hero-mid b { font-size: 56px; font-weight: 200; letter-spacing: -.04em; }
:root[data-theme="dark"] .g-ring .ring-prog { filter: drop-shadow(0 0 10px var(--accent)); }
.g-hero.won { border-color: var(--accent); }
.g-empty { text-align: center; padding: 56px 20px 40px; display: flex; flex-direction: column; align-items: center; gap: 6px; }
.g-empty .g-why { margin: 10px auto 26px; }
.g-peak { color: var(--accent); margin-bottom: 8px; animation: floaty 4s ease-in-out infinite alternate; }
.g-body { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 18px; align-items: start; }
.gpath { width: 100%; height: auto; display: block; overflow: visible; }
.gp-hill { fill: var(--card2); opacity: .6; } .gp-hill.far { opacity: .32; }
.gp-line { fill: none; stroke: var(--line2); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 1 11; }
.gp-lit { fill: none; stroke: var(--accent); stroke-width: 5; stroke-linecap: round; }
:root[data-theme="dark"] .gp-lit { filter: drop-shadow(0 0 6px var(--accent)); }
.gp-base-dot { fill: var(--accent); }
.gp-node { cursor: pointer; transform-box: fill-box; transform-origin: center; }
.gp-hit { fill: transparent; }
.gp-node .gp-c { fill: var(--card); stroke: var(--line2); stroke-width: 2; transition: fill .3s, stroke .3s; }
.gp-node text { fill: var(--text3); font-weight: 700; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
.gp-node.next .gp-c { stroke: var(--accent); stroke-width: 3; } .gp-node.next text { fill: var(--text); }
.gp-node.done .gp-c { fill: var(--accent); stroke: var(--accent); }
.gp-tick { fill: none; stroke: var(--accent-ink); stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.gp-pulse { fill: none; stroke: var(--accent); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; pointer-events: none; }
@keyframes pulse { from { transform: scale(1); opacity: .9; } to { transform: scale(1.9); opacity: 0; } }
.gp-node.pop { animation: pop .55s cubic-bezier(.2, 1.6, .4, 1); }
.gp-summit { color: var(--text3); transform-box: fill-box; transform-origin: center; }
.gp-summit .gp-c { fill: var(--card2); stroke: var(--line2); stroke-width: 2; }
.gp-summit .gp-glow { fill: var(--accent); opacity: 0; }
.gp-summit.reached { color: var(--accent-ink); }
.gp-summit.reached .gp-c { fill: var(--accent); stroke: var(--accent); }
.gp-summit.reached .gp-glow { opacity: .28; filter: blur(9px); animation: pulse 2.4s ease-out infinite; }
@keyframes nodein { from { opacity: 0; transform: scale(.3); } }
.view.enter .gp-node, .view.enter .gp-summit { animation: nodein .5s cubic-bezier(.2, 1.4, .4, 1) both; animation-delay: calc(.45s + var(--d)); }
.gs { display: flex; align-items: center; gap: 6px; padding: 5px 8px; border-radius: 15px; min-height: 52px; }
.gs.next { background: var(--accent-soft); }
.gs-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; text-align: left; padding: 4px 0; }
.gs-main .grow { display: flex; flex-direction: column; gap: 2px; }
.gs-n { width: 22px; font-weight: 700; color: var(--text3); font-size: 13px; text-align: center; flex: none; }
.gs.done .task-title { color: var(--text3); text-decoration: line-through; }
.g-steps .quick-add { padding: 12px 0 0; }
/* main target on Home */
.hg { display: flex; align-items: center; gap: 20px; text-align: left; }
.hg-ring { position: relative; width: 92px; height: 92px; flex: none; display: grid; place-items: center; }
.hg-ring svg { position: absolute; inset: 0; }
.hg-ring b { font-size: 22px; font-weight: 600; letter-spacing: -.02em; } .hg-ring small { font-size: 11px; color: var(--text3); }
.hg-t { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.hg-title { font-size: 22px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.hg-meta { display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; color: var(--text2); min-width: 0; }

/* ---------- goal opening sequence ---------- */
.gi { position: fixed; inset: 0; z-index: 60; background: #000; color: #F5F5F7; display: grid; place-items: center; padding: 30px; overflow: hidden; transition: opacity .5s; cursor: pointer; }
.gi.out { opacity: 0; pointer-events: none; }
.gi-cv { position: absolute; inset: 0; width: 100%; height: 100%; }
.gi-glow { position: absolute; left: 50%; bottom: -48%; width: 130vmax; height: 84vmax; background: radial-gradient(closest-side, color-mix(in srgb, var(--accent) 36%, transparent), transparent); animation: giglow 2.6s ease-out both; }
@keyframes giglow { from { opacity: 0; transform: translateX(-50%) scale(.6); } to { opacity: 1; transform: translateX(-50%) scale(1); } }
.gi-in { position: relative; text-align: center; max-width: 1040px; }
.gi-k { font-size: 16px; font-weight: 650; letter-spacing: .02em; color: var(--accent); animation: gifade .7s .15s both; }
.gi-t { font-size: clamp(42px, 8vw, 104px); font-weight: 700; letter-spacing: -.04em; line-height: 1.02; margin-top: 18px; text-wrap: balance; }
.gi-t span { display: inline-block; padding-bottom: .14em; margin-bottom: -.14em; background: linear-gradient(100deg, #F5F5F7 43%, color-mix(in srgb, var(--accent) 85%, #fff) 50%, #F5F5F7 57%); background-size: 320% 100%; background-position: 100% 0; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; color: transparent; animation: giword .8s cubic-bezier(.2, .8, .2, 1) both, gishine 5.5s linear infinite; }
@keyframes gishine { from { background-position: 100% 0; } to { background-position: 0 0; } }
/* held animation: stays on, keeps breathing, until the Animation button is tapped */
.gi.hold { cursor: default; }
.gi.hold .gi-in { animation: gibreathe 7s ease-in-out 3s infinite alternate; }
.gi.hold .gi-glow { animation: giglow 2.6s ease-out both, giglow2 8s ease-in-out 2.6s infinite alternate; }
@keyframes gibreathe { from { transform: scale(1); } to { transform: scale(1.025); } }
@keyframes giglow2 { from { opacity: 1; transform: translateX(-50%) scale(1); } to { opacity: .62; transform: translateX(-50%) scale(1.12); } }
.fab { position: fixed; right: calc(26px + var(--sar)); bottom: calc(24px + var(--sab)); z-index: 45; height: 46px; padding: 0 19px 0 15px; border-radius: 23px; background: var(--card); border: 1px solid var(--line2); box-shadow: var(--shadow); display: inline-flex; align-items: center; gap: 8px; font-weight: 650; font-size: 15px; color: var(--text); transition: transform .12s, background .2s; }
.fab:active { transform: scale(.96); }
.fab svg { color: var(--accent); }
body.gi-live .fab { z-index: 66; background: rgba(255, 255, 255, .1); color: #F5F5F7; border-color: rgba(255, 255, 255, .22); box-shadow: none; -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
body.gi-live .fab.on { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
.fab.on svg { color: inherit; }
.goals { padding-bottom: 66px; }
@keyframes giword { from { opacity: 0; transform: translateY(.5em) scale(.96); filter: blur(12px); } }
@keyframes gifade { from { opacity: 0; transform: translateY(8px); } }
.gi-why { font-size: clamp(17px, 2vw, 22px); color: rgba(235, 235, 245, .74); margin: 26px auto 0; max-width: 30em; line-height: 1.45; animation: gifade .8s both; }
.gi-line { width: min(420px, 70vw); height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .14); margin: 36px auto 0; overflow: hidden; animation: gifade .6s both; }
.gi-line i { display: block; height: 100%; width: var(--p); background: var(--accent); border-radius: 2px; transform-origin: left; animation: growx 1.1s cubic-bezier(.2, .8, .2, 1) both; }
.gi-foot { display: flex; gap: 8px 28px; justify-content: center; flex-wrap: wrap; margin-top: 18px; font-size: 15px; color: rgba(235, 235, 245, .62); animation: gifade .7s both; }
.gi-foot b { color: #fff; font-weight: 650; }

@media (orientation: portrait), (max-width: 860px) {
  .fab { bottom: calc(80px + var(--sab)); right: calc(20px + var(--sar)); }
}
@media (orientation: portrait), (max-width: 1100px) {
  .home > .hh, .home > .hg-card { grid-column: 1 / -1; }
  .hb-hero { grid-template-columns: auto minmax(0, 1fr); }
  .hb-figs { grid-column: 1 / -1; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .g-body { grid-template-columns: minmax(0, 1fr); }
  .g-ring { width: 190px; height: 190px; } .g-ring svg { width: 190px; height: 190px; } .g-ring .hero-mid b { font-size: 44px; }
}
@media (max-width: 720px) {
  .hb-hero { grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 22px; padding: 22px 18px; }
  .hb-week { width: 100%; } .hb-figs { grid-template-columns: minmax(0, 1fr); justify-self: start; }
  .hb { grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; padding: 14px; }
  .hb-strip { grid-column: 1 / -1; grid-row: 2; justify-content: space-between; } .cap { flex: 1; }
  .g-hero { padding: 18px 20px 26px; } .g-hero-in { flex-direction: column-reverse; align-items: flex-start; gap: 22px; }
  .g-facts { gap: 22px; } .g-facts b { font-size: 28px; }
  .icon-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  .hm { width: 14px; height: 14px; } .hm-months span { width: 14px; }
  .modal .statline { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}

/* ---------- Alex, the coach: the square in the top-right ---------- */
.alex, .alex-big { display: grid; place-items: center; flex: none; position: relative; background: radial-gradient(120% 120% at 30% 18%, color-mix(in srgb, var(--accent) 36%, #17171c), #09090c 72%); }
.alex { width: 46px; height: 46px; border-radius: 15px; animation: alexglow 4s ease-in-out infinite alternate; transition: transform .15s; }
.alex:active { transform: scale(.92); }
@keyframes alexglow { from { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent), 0 0 8px 0 var(--accent-soft); } to { box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 80%, transparent), 0 0 20px 3px var(--accent-soft); } }
.alex-face { display: flex; gap: 7px; align-items: center; justify-content: center; animation: alexfloat 3.6s ease-in-out infinite alternate; }
.alex-face i { width: 7px; height: 14px; border-radius: 4px; background: var(--accent); box-shadow: 0 0 9px var(--accent); animation: blink 5.2s infinite; display: block; }
.alex-face i:nth-child(2) { animation-delay: .05s; }
@keyframes blink { 0%, 92%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }
@keyframes alexfloat { from { transform: translateY(1px); } to { transform: translateY(-1.5px); } }
@keyframes alexlook { from { transform: translateX(-2.5px); } to { transform: translateX(2.5px); } }
.alex-face.happy i { height: 8px; width: 12px; background: none; box-shadow: none; border: 3px solid var(--accent); border-bottom: 0; border-radius: 10px 10px 0 0; filter: drop-shadow(0 0 4px var(--accent)); animation: none; }
.alex-face.alert i { height: 18px; }
.alex-face.talk { animation: alexlook 1.1s ease-in-out infinite alternate; }
.alex-dot { position: absolute; top: -4px; right: -4px; width: 13px; height: 13px; border-radius: 50%; background: #FF5A4F; border: 2.5px solid var(--bg); display: none; }
.alex.unread .alex-dot { display: block; animation: pop .45s cubic-bezier(.2, 1.6, .4, 1); }
.alex-big { width: 72px; height: 72px; border-radius: 22px; box-shadow: inset 0 0 0 1.5px color-mix(in srgb, var(--accent) 62%, transparent), 0 0 28px var(--accent-soft); }
.alex-big .alex-face { gap: 12px; }
.alex-big .alex-face i { width: 11px; height: 23px; border-radius: 6px; }
.alex-big .alex-face.happy i { width: 18px; height: 12px; border-width: 4.5px; border-radius: 15px 15px 0 0; }
.alex-big .alex-face.alert i { height: 28px; }
.alex-big.sm { width: 54px; height: 54px; border-radius: 17px; }
.alex-big.sm .alex-face { gap: 8px; } .alex-big.sm .alex-face i { width: 8px; height: 16px; border-radius: 4px; }
.alex-big.sm .alex-face.happy i { width: 13px; height: 9px; border-width: 3.5px; }
.alex-big.xs { width: 38px; height: 38px; border-radius: 12px; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--accent) 60%, transparent); }
.alex-big.xs .alex-face { gap: 6px; } .alex-big.xs .alex-face i { width: 6px; height: 12px; border-radius: 3px; }
.alex-big.xs .alex-face.happy i { width: 10px; height: 7px; border-width: 3px; }
/* speech bubble */
#alex-bubble { position: fixed; top: calc(66px + var(--sat)); right: calc(26px + var(--sar)); z-index: 44; width: min(390px, calc(100vw - 32px)); pointer-events: none; }
/* on the Focus screen the note sits bottom-right, clear of the timer controls */
body[data-view="focus"] #alex-bubble { top: auto; bottom: calc(24px + var(--sab)); }
body[data-view="focus"] .ab { border-radius: 22px 22px 7px 22px; transform-origin: bottom right; }
.ab { pointer-events: auto; display: flex; gap: 12px; align-items: flex-start; padding: 14px; border-radius: 22px 7px 22px 22px; background: var(--card); border: 1px solid var(--line2); box-shadow: var(--shadow); animation: abin .42s cubic-bezier(.2, 1.3, .4, 1) both; transform-origin: top right; cursor: pointer; }
.ab.out { animation: about .25s both; }
@keyframes abin { from { opacity: 0; transform: translateY(-10px) scale(.88); } }
@keyframes about { to { opacity: 0; transform: translateY(-6px) scale(.95); } }
.ab b { font-size: 13px; color: var(--accent); font-weight: 650; }
.ab p { font-size: 14.5px; line-height: 1.4; margin-top: 2px; min-height: 1.4em; }
.ab .btn { margin-top: 10px; }
.ab-x { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: var(--text3); flex: none; background: var(--card2); }
.typing::after { content: ""; display: inline-block; width: 2px; height: 1em; background: var(--accent); margin-left: 2px; vertical-align: -2px; animation: caret .7s steps(1) infinite; }
@keyframes caret { 50% { opacity: 0; } }
/* coach panel slides in from the right */
.modal-back.side { place-items: stretch end; padding: 0; }
.modal-back.side .modal { width: min(500px, 100%); max-height: none; height: 100%; border-radius: 32px 0 0 32px; border-right: 0; transform: translateX(70px); opacity: 0; transition: transform .4s cubic-bezier(.2, .9, .3, 1), opacity .25s; }
.modal-back.side.in .modal { transform: none; opacity: 1; }
.coach-h { display: flex; align-items: center; gap: 16px; padding: calc(22px + var(--sat)) 22px 14px 24px; flex: none; }
.coach-h h2 { font-size: 27px; font-weight: 700; letter-spacing: -.025em; line-height: 1.1; }
.coach-h p { color: var(--text2); font-size: 14px; }
.coach-h .icon-btn { background: var(--card2); }
.coach-b { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 4px 24px calc(26px + var(--sab)); }
.coach-hi { font-size: 19px; font-weight: 550; line-height: 1.42; letter-spacing: -.01em; min-height: 2.84em; margin-bottom: 16px; }
.mission { border-radius: 22px; padding: 18px 20px; background: var(--accent); color: var(--accent-ink); animation: rise .5s .15s both; }
.mission .g-k { color: inherit; opacity: .72; }
.mission b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.02em; margin: 6px 0 4px; line-height: 1.2; overflow-wrap: anywhere; }
.mission p { font-size: 14.5px; opacity: .86; margin-bottom: 14px; line-height: 1.4; }
.mission .btn { background: var(--accent-ink); color: var(--accent); }
.coach-sec { font-size: 13px; font-weight: 650; color: var(--text3); padding: 20px 2px 9px; }
.ins { display: flex; gap: 14px; padding: 14px 16px; border-radius: 18px; background: var(--card2); margin-bottom: 8px; animation: rise .45s cubic-bezier(.2, .8, .2, 1) both; animation-delay: calc(.22s + var(--i, 0) * 60ms); }
.ins-ic { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; flex: none; background: var(--accent-soft); color: var(--accent); }
.ins.warn .ins-ic { background: color-mix(in srgb, var(--warn) 18%, transparent); color: var(--warn); }
.ins.good .ins-ic { background: color-mix(in srgb, var(--good) 18%, transparent); color: var(--good); }
.ins b { font-size: 15.5px; font-weight: 650; line-height: 1.25; display: block; overflow-wrap: anywhere; }
.ins p { font-size: 14px; color: var(--text2); margin-top: 3px; line-height: 1.4; }
.ins .btn { margin-top: 10px; background: var(--raise); }
:root[data-theme="dark"] .ins .btn { background: #34343a; }
.cmp { display: grid; gap: 6px; margin-top: 11px; }
.cmp-r { display: grid; grid-template-columns: 98px minmax(0, 1fr) auto; gap: 10px; align-items: center; font-size: 12.5px; color: var(--text2); }
.cmp-r b { font-size: 12.5px; color: var(--text); min-width: 46px; text-align: right; display: inline; }
.cmp .bar { height: 7px; background: var(--line); }
.cmp .bar i { animation: growx .9s cubic-bezier(.2, .8, .2, 1) .55s both; transform-origin: left; }
.coach-week { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
.coach-week > div { background: var(--card2); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.coach-week b { font-size: 18px; font-weight: 650; letter-spacing: -.02em; white-space: nowrap; }
.coach-week span { font-size: 11.5px; color: var(--text2); }
.coach-q { display: flex; align-items: center; gap: 10px; margin-top: 18px; padding: 16px 18px; border-radius: 18px; border: 1px dashed var(--line2); }
.coach-q p { flex: 1; font-size: 15.5px; font-weight: 550; line-height: 1.4; }
.home > .alex-home { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; padding: 14px 20px 14px 14px; cursor: pointer; }
.alex-home .grow { min-width: 0; }
.alex-home b { display: block; font-size: 16.5px; font-weight: 650; margin-top: 1px; }
.alex-home p { font-size: 13.5px; color: var(--text2); }

/* coach: tabs, score, challenge, ask, plan, review */
.coach-tabs { padding: 0 24px 12px; flex: none; }
.coach-tabs .seg { display: flex; width: 100%; }
.coach-tabs .seg button { flex: 1; justify-content: center; padding: 0 6px; }
.ascore { display: flex; align-items: center; gap: 18px; padding: 16px 18px; border-radius: 22px; background: var(--card2); margin-bottom: 10px; animation: rise .5s .1s both; }
.ascore-ring { position: relative; width: 86px; height: 86px; flex: none; display: grid; place-items: center; }
.ascore-ring svg { position: absolute; inset: 0; }
.ascore-ring b { font-size: 26px; font-weight: 650; letter-spacing: -.03em; }
.ascore .grow { display: flex; flex-direction: column; gap: 1px; min-width: 0; }

.jmom b { font-size: 24px; font-weight: 650; letter-spacing: -.02em; } .jmom b.up { color: var(--good); } .jmom b.down { color: var(--bad); }
.jms { display: grid; gap: 4px; }
.jm { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-bottom: 1px solid var(--line); }
.jm:last-child { border-bottom: 0; }
.jm b { font-size: 16px; font-weight: 650; }
.jm-ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--card2); color: var(--text3); flex: none; }
.jm.done .jm-ic { background: rgba(255, 159, 67, .18); color: var(--jsf); }
.jm.next .jm-ic { background: var(--jsf); color: #2A1204; }
.jh { width: 15px; height: 15px; border-radius: 4px; background: var(--card2); display: block; flex: none; }
.legend .jh { display: inline-block; }
.jh.l1 { background: rgba(255, 159, 67, .3); } .jh.l2 { background: rgba(255, 159, 67, .52); } .jh.l3 { background: rgba(255, 159, 67, .76); } .jh.l4 { background: #FF9F43; } .jh.fut { opacity: .3; }
.jin .hm-months span { width: 15px; }

@media (orientation: portrait), (max-width: 1100px) {
  .jp-grid { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(300px, 1fr) auto; }
  .jp-side { overflow: visible; }
  .jp-acts { margin-top: 0; }
  .jtiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .jrow { grid-template-columns: minmax(0, 1fr); }
}
@media (orientation: portrait) and (min-width: 700px) {
  .jp-side { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; }
  .jp-naams, .jp-pace, .jp-acts, .jp-theme, .jw { grid-column: 1 / -1; }
  .jw-bars { height: 96px; }
  .jp-cards { grid-template-columns: 1fr; }
}

/* ---------- JSR: Ram Darshan theme ---------- */
.jp-pad.dar { background: #0b0603; border-color: rgba(255, 200, 130, .3); }
.dar > * { pointer-events: none; }
.dr-bg { position: absolute; left: -9%; top: -9%; width: 118%; height: 118%; max-width: none; object-fit: cover; object-position: 50% 30%; filter: blur(26px) brightness(.4) saturate(1.3); z-index: 0; }
.dr-stage { position: absolute; z-index: 1; transform-origin: 50.4% 26.4%; will-change: transform; }
.dr-imgw { position: absolute; inset: 0; overflow: hidden; -webkit-mask-image: linear-gradient(90deg, transparent 0, #000 3.5%, #000 96.5%, transparent 100%); mask-image: linear-gradient(90deg, transparent 0, #000 3.5%, #000 96.5%, transparent 100%); }
.dr-img { display: block; width: 100%; height: 100%; max-width: none; -webkit-user-drag: none; -webkit-touch-callout: none; }
.dr-sweep { position: absolute; inset: 0; background: linear-gradient(112deg, rgba(255, 236, 200, 0) 41%, rgba(255, 236, 200, .55) 50%, rgba(255, 236, 200, 0) 59%) no-repeat; background-size: 260% 100%; background-position: 160% 0; mix-blend-mode: soft-light; animation: drsweep 12s ease-in-out 2s infinite; }
@keyframes drsweep { 0% { background-position: 160% 0; } 34%, 100% { background-position: -100% 0; } }
/* light from behind the head: two fans of thin rays turning against each other */
.dr-rays { position: absolute; left: 50.4%; top: 26.4%; width: 176%; aspect-ratio: 1; transform: translate(-50%, -50%); mix-blend-mode: screen; opacity: .5; transition: opacity .8s;
  background: repeating-conic-gradient(from 0deg, rgba(255, 216, 150, .6) 0deg 1.5deg, rgba(255, 216, 150, 0) 1.5deg 8deg); animation: drspin 120s linear infinite;
  -webkit-mask-image: radial-gradient(closest-side, transparent 22%, #000 30%, rgba(0, 0, 0, .3) 56%, transparent 88%); mask-image: radial-gradient(closest-side, transparent 22%, #000 30%, rgba(0, 0, 0, .3) 56%, transparent 88%); }
.dr-rays.r2 { opacity: .36; background: repeating-conic-gradient(from 2deg, rgba(255, 186, 100, .55) 0deg 1deg, rgba(255, 186, 100, 0) 1deg 6.5deg); animation: drspin 170s linear infinite reverse; }
@keyframes drspin { from { transform: translate(-50%, -50%) rotate(0deg); } to { transform: translate(-50%, -50%) rotate(360deg); } }
.dr-halo { position: absolute; left: 50.4%; top: 26.4%; width: 66%; aspect-ratio: 1; margin: -33% 0 0 -33%; border-radius: 50%; mix-blend-mode: screen;
  background: radial-gradient(closest-side, rgba(255, 214, 150, 0) 52%, rgba(255, 206, 128, .6) 69%, rgba(255, 164, 64, .2) 86%, rgba(255, 150, 50, 0) 100%); animation: drbreathe 5.5s ease-in-out infinite alternate; }
@keyframes drbreathe { from { transform: scale(.96); opacity: .6; } to { transform: scale(1.05); opacity: 1; } }
.dr-halo.pulse { animation: drpulse .6s ease-out; }
@keyframes drpulse { 0% { transform: scale(1); opacity: 1; filter: brightness(1.9); } 100% { transform: scale(1.08); opacity: .8; filter: brightness(1); } }
.dar.flare .dr-halo { animation: drflare 2.3s ease-out; }
@keyframes drflare { 0% { transform: scale(.9); opacity: 1; filter: brightness(1); } 18% { transform: scale(1.25); opacity: 1; filter: brightness(2.6); } 100% { transform: scale(1.02); opacity: .85; filter: brightness(1); } }
.dar.flare .dr-rays { opacity: 1; }
/* the two lamps in the picture, lit */
.dr-flame { position: absolute; left: 5.4%; top: 77.6%; width: 13%; aspect-ratio: 1; margin: -6.5% 0 0 -6.5%; border-radius: 50%; mix-blend-mode: screen;
  background: radial-gradient(closest-side, rgba(255, 240, 190, .95) 0, rgba(255, 180, 70, .6) 22%, rgba(255, 130, 30, .22) 55%, rgba(255, 120, 20, 0) 100%); animation: drflick 1.9s ease-in-out infinite; }
.dr-flame.r { left: 95.3%; top: 77.4%; animation-duration: 2.6s; animation-delay: -.8s; }
@keyframes drflick { 0%, 100% { transform: scale(1); opacity: .78; } 18% { transform: scale(1.14); opacity: 1; } 37% { transform: scale(.94); opacity: .66; } 58% { transform: scale(1.1); opacity: .95; } 80% { transform: scale(.98); opacity: .72; } }
.dr-vig { position: absolute; inset: 0; z-index: 2;
  background: linear-gradient(180deg, rgba(12, 6, 3, .66) 0, rgba(12, 6, 3, .34) 9%, rgba(12, 6, 3, 0) 21%), linear-gradient(0deg, rgba(12, 6, 3, .5) 0, rgba(12, 6, 3, 0) 13%), radial-gradient(ellipse 76% 70% at 50% 46%, rgba(10, 5, 2, 0) 50%, rgba(10, 5, 2, .62) 100%); }
.dr-cv { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 3; }
.dr-beads { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; overflow: visible; }
.dar .jp-thread { fill: none; stroke: rgba(255, 216, 150, .3); stroke-width: 1; }
.dar #jp-beads .b { fill: rgba(22, 11, 4, .7); stroke: rgba(255, 224, 176, .55); stroke-width: .9; transition: fill .35s, stroke .35s; }
.dar #jp-beads .b.on { fill: #FFC057; stroke: #FFF0CF; }
.dar #jp-beads .b.cur { fill: #FFF6DC; }
.dar #jp-beads.full .b { animation: drflash 1.1s ease-out both; }
@keyframes drflash { 0% { fill: #FFF6DC; } 60% { fill: #FFC057; } 100% { fill: rgba(22, 11, 4, .7); } }
/* the count: a glass pill above the crown */
.dr-top { position: absolute; z-index: 5; left: 50%; top: 27px; transform: translateX(-50%); display: flex; align-items: center; gap: 14px; height: 54px; padding: 0 22px; border-radius: 999px; white-space: nowrap; max-width: calc(100% - 44px);
  background: rgba(20, 10, 4, .58); border: 1px solid rgba(255, 210, 150, .34); box-shadow: 0 10px 30px rgba(0, 0, 0, .4), inset 0 1px 0 rgba(255, 236, 200, .12); -webkit-backdrop-filter: blur(16px) saturate(1.4); backdrop-filter: blur(16px) saturate(1.4); }
.dar .jp-naam { font-size: 15px; font-weight: 650; color: #FFCB85; letter-spacing: .01em; overflow: hidden; text-overflow: ellipsis; }
.dar .jp-count { font-size: 36px; font-weight: 600; letter-spacing: -.03em; line-height: 1; color: #FFF6E6; text-shadow: 0 0 22px rgba(255, 170, 70, .55); padding: 0 14px; border-left: 1px solid rgba(255, 216, 160, .25); border-right: 1px solid rgba(255, 216, 160, .25); }
.dar .jp-mala { font-size: 13.5px; color: rgba(255, 238, 214, .8); }
/* wide tap area (iPad held upright): picture to the right, a big count beside it */
.dar.wide .dr-top { left: 0; top: 50%; width: var(--cw); max-width: none; height: auto; transform: translateY(-50%); flex-direction: column; gap: 8px; padding: 0 16px; white-space: normal; text-align: center; background: none; border: 0; box-shadow: none; -webkit-backdrop-filter: none; backdrop-filter: none; }
.dar.wide .jp-naam { font-size: 19px; }
.dar.wide .jp-count { font-size: clamp(56px, calc(var(--cw) * .21), 120px); font-weight: 200; letter-spacing: -.04em; border: 0; padding: 0; text-shadow: 0 0 34px rgba(255, 160, 60, .5); }
.dar.wide .jp-mala { font-size: 15px; }
.dar .jp-hint { z-index: 5; bottom: 34px; animation: drhint 8s ease forwards; }
.dar .jp-hint span { display: inline-block; padding: 7px 14px; border-radius: 999px; background: rgba(20, 10, 4, .6); color: rgba(255, 240, 216, .92); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); }
@keyframes drhint { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
.dar .jp-fx { z-index: 6; }
.dar .jp-fx .rip { border-color: rgba(255, 232, 180, .95); box-shadow: 0 0 14px rgba(255, 170, 60, .7); }
.dar .jp-fx .flt { color: #FFE9BD; text-shadow: 0 1px 2px rgba(0, 0, 0, .7), 0 0 14px rgba(255, 150, 50, .9); }
.dar .jp-pop { top: auto; bottom: 13%; padding: 10px 24px 12px; border-radius: 22px; background: rgba(20, 10, 4, .66); border: 1px solid rgba(255, 210, 150, .36); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
/* temple doors open when the darshan appears */
.dr-door { position: absolute; top: 0; bottom: 0; width: 50.6%; z-index: 7; transform: translateX(-103%);
  background: linear-gradient(90deg, rgba(255, 205, 140, 0) 0, rgba(255, 205, 140, 0) calc(100% - 3px), rgba(255, 205, 140, .7) calc(100% - 3px)), repeating-linear-gradient(0deg, rgba(255, 196, 120, .07) 0 2px, rgba(255, 196, 120, 0) 2px 96px), repeating-linear-gradient(90deg, rgba(0, 0, 0, .16) 0 1px, rgba(0, 0, 0, 0) 1px 46px), linear-gradient(90deg, #120803 0, #2a1408 58%, #40200d 100%); }
.dr-door.l { left: 0; }
.dr-door.r { right: 0; transform: translateX(103%) scaleX(-1); }
.dr-door::after { content: ""; position: absolute; right: 22px; top: 50%; width: 26px; height: 26px; margin-top: -13px; border-radius: 50%; border: 3px solid #E6B25C; box-shadow: 0 0 0 1px rgba(0, 0, 0, .4), 0 3px 8px rgba(0, 0, 0, .5); }
.view.enter .dr-door.l { animation: drdoorl 1.25s cubic-bezier(.76, 0, .22, 1) both; }
.view.enter .dr-door.r { animation: drdoorr 1.25s cubic-bezier(.76, 0, .22, 1) both; }
@keyframes drdoorl { 0%, 14% { transform: none; } 100% { transform: translateX(-103%); } }
@keyframes drdoorr { 0%, 14% { transform: scaleX(-1); } 100% { transform: translateX(103%) scaleX(-1); } }
.view.enter .dr-imgw { animation: drdawn 1.28s ease-out both; }
@keyframes drdawn { 0%, 20% { filter: brightness(.3) saturate(.5); } 100% { filter: none; } }
.view.enter .dr-top { animation: drtop .7s cubic-bezier(.2, .8, .2, 1) .55s both; }
@keyframes drtop { from { opacity: 0; } }
.dar.calm .dr-rays, .dar.calm .dr-sweep, .dar.calm .dr-flame, .dar.calm .dr-halo { animation: none; }

/* theme switch under the counter */
.jp-theme { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; margin-top: auto; }
.jp-theme + .jp-acts { margin-top: 0; }
.jp-ths { display: flex; gap: 8px; }
.jp-th { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 15px 0 6px; border-radius: 17px; background: var(--card2); border: 1.5px solid transparent; font-size: 14px; font-weight: 600; color: var(--text2); transition: border-color .2s, background .2s; }
.jp-th.on { border-color: var(--jsf); background: rgba(255, 159, 67, .12); color: var(--text); }
.jp-th:active { transform: scale(.97); }
.th-pv { position: relative; width: 34px; height: 34px; border-radius: 10px; flex: none; display: block; overflow: hidden; background: #1a0d05; }
.th-mala::before { content: ""; position: absolute; inset: 6px; border-radius: 50%; border: 3px dotted #FFB54D; }
.th-ram img { display: block; width: 250%; max-width: none; margin: -72% 0 0 -76%; pointer-events: none; }

@media (orientation: landscape) and (min-width: 1101px) {
  .jsr.counter .jw-bars { height: 100px; }
}
@media (orientation: portrait), (max-width: 1100px) {
  .jp-theme { margin-top: 0; }
}
/* iPad held upright: give the darshan a tall frame and let the page scroll to the controls */
@media (orientation: portrait) and (min-width: 721px) {
  body[data-view="jsr"] .view.fixed:has(.th-dar) { overflow-y: auto; display: block; }
  .jsr.th-dar .jp-grid { grid-template-rows: auto auto; }
  .jsr.th-dar .jp-pad.dar { height: min(66vh, 1000px); }
  body.zen .jsr.th-dar .jp-pad.dar { height: min(74vh, 1100px); }
}
@media (max-width: 720px) {
  .jp-pad.dar { height: 128vw; max-height: 76vh; }
  .dr-top { gap: 10px; padding: 0 16px; height: 48px; top: 25px; }
  .dar .jp-count { font-size: 30px; padding: 0 10px; }
  .dar .jp-naam { font-size: 13.5px; } .dar .jp-mala { font-size: 12px; }
  .jp-ths { width: 100%; } .jp-th { flex: 1; }
}

/* ============================================================

   ============================================================ */
const STORE_KEY = 'focus.v1';
const SEEN_KEY = 'focus.seen';
const DAY = 86400000;

const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = n => String(n).padStart(2, '0');
const clamp = (n, a, b) => Math.max(a, Math.min(b, n));
const num = (v, d) => { const n = parseFloat(v); return isFinite(n) ? n : d; };

const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const MON3 = MONTHS.map(m => m.slice(0, 3));
const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];

const dkey = d => { d = new Date(d); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const todayKey = () => dkey(new Date());
const parseKey = k => { const p = k.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const diffDays = (a, b) => Math.round((parseKey(b) - parseKey(a)) / DAY);
const addMonths = (k, n) => { const d = parseKey(k); d.setDate(1); d.setMonth(d.getMonth() + n); return dkey(d); };

/* Times are always 12-hour with AM/PM */
const fmtTime = ts => { const d = new Date(ts); const h = d.getHours(); return (h % 12 || 12) + ':' + pad(d.getMinutes()) + ' ' + (h >= 12 ? 'PM' : 'AM'); };
const fmtHour = h => (h % 12 || 12) + ' ' + (h >= 12 ? 'PM' : 'AM');
const fmtDur = sec => {
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
  if (h && m) return h + 'h ' + m + 'm';
  if (h) return h + 'h';
  return m + 'm';
};
const fmtHrs = sec => { const h = sec / 3600; return (h >= 100 ? Math.round(h) : Math.round(h * 10) / 10) + 'h'; };
const fmtClock = sec => {
  sec = Math.max(0, Math.floor(sec));
  const h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  return h ? h + ':' + pad(m) + ':' + pad(s) : pad(m) + ':' + pad(s);
};
const fmtDate = (k, style) => {
  const d = parseKey(k);
  if (style === 'long') return DOWL[d.getDay()] + ', ' + d.getDate() + ' ' + MONTHS[d.getMonth()];
  if (style === 'short') return d.getDate() + ' ' + MON3[d.getMonth()];
  if (style === 'full') return d.getDate() + ' ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear();
  return DOW[d.getDay()] + ', ' + d.getDate() + ' ' + MON3[d.getMonth()];
};
const relDay = k => { const n = diffDays(todayKey(), k); if (n === 0) return 'Today'; if (n === 1) return 'Tomorrow'; if (n === -1) return 'Yesterday'; return fmtDate(k); };
const weekStartKey = k => { const d = parseKey(k); const diff = (d.getDay() - S.settings.weekStart + 7) % 7; return addDays(k, -diff); };
const monthStartKey = k => k.slice(0, 8) + '01';
const daysInMonth = k => { const d = parseKey(k); return new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate(); };

  const parts = [
    { label: 'Focus time', w: 0.5, v: target ? Math.min(1, di.sec / target) : null, text: fmtDur(di.sec) + ' of ' + fmtDur(target) },
    { label: 'Tasks', w: 0.2, v: tasks.length ? done / tasks.length : null, text: tasks.length ? done + ' of ' + tasks.length + ' done' : 'No tasks planned' },
    { label: 'Focus quality', w: 0.2, v: rated.length ? avg / 5 : null, text: rated.length ? avg.toFixed(1) + ' of 5' : 'No ratings yet' },
    { label: 'Clean sessions', w: 0.1, v: di.list.length ? 1 - broken / di.list.length : null, text: di.list.length ? (broken ? broken + ' broken' : 'None broken') : 'No sessions' }
  ];
  let sw = 0, sv = 0;

  const score = sw ? Math.round(100 * sv / sw) : 0;

const RANGES = [['7d', '7 days'], ['30d', '30 days'], ['12w', '12 weeks'], ['12m', '12 months']];
function buckets(range) {

    for (let i = n - 1; i >= 0; i--) { const k = addDays(tk, -i); const d = parseKey(k); out.push({ k1: k, k2: k, label: n === 7 ? DOW[d.getDay()] : String(d.getDate()), tick: n === 7 || d.getDate() === 1 || i === 0 || d.getDay() === S.settings.weekStart, name: fmtDate(k) }); }
  } else if (range === '12w') {
    const ws = weekStartKey(tk);
    for (let i = 11; i >= 0; i--) { const k1 = addDays(ws, -7 * i); out.push({ k1, k2: addDays(k1, 6), label: fmtDate(k1, 'short'), tick: i % 2 === 1 || i === 0, name: 'Week of ' + fmtDate(k1, 'short') }); }
  } else {
    const ms = monthStartKey(tk);
    for (let i = 11; i >= 0; i--) { const k1 = addMonths(ms, -i); const d = parseKey(k1); out.push({ k1, k2: addDays(k1, daysInMonth(k1) - 1), label: MON3[d.getMonth()], tick: true, name: MONTHS[d.getMonth()] + ' ' + d.getFullYear() }); }
  }

    for (let k = b.k1; k <= b.k2; k = addDays(k, 1)) { const di = dayInfo(k); b.sec += di.sec; for (const a in di.byArea) b.byArea[a] = (b.byArea[a] || 0) + di.byArea[a]; }
  }
  return out;
}

  for (let i = 0; i < 4000 && k >= h.first; i++) {

  for (let k = h.first, i = 0; k <= tk && i < 4000; k = addDays(k, 1), i++) {
    if (h.log[k]) { run++; if (run > best) best = run; }
    else if (habitOn(h, k) && k !== tk) run = 0;
  }
  return best;
}
function habitRate(h, days) {
  const tk = todayKey(); let due = 0, done = 0;
  for (let i = 0; i < days; i++) { const k = addDays(tk, -i); if (k < h.first) break; if (habitOn(h, k) || h.log[k]) { due++; if (h.log[k]) done++; } }

/* ---------- the climb: steps drawn as a path up a mountain ---------- */
const f1 = n => (Math.round(n * 10) / 10);
function goalPathSVG(g) {
  const n = g.steps.length, m = n + 1, W = 760, H = 330;
  const pts = [];
  for (let i = 0; i <= m; i++) {
    const t = i / m; const wob = (i === 0 || i === m) ? 0 : (i % 2 ? -1 : 1) * Math.min(24, 130 / m);
    pts.push([46 + (W - 104) * t, (H - 44) - (H - 112) * Math.pow(t, 1.15) + wob]);

  const nextIdx = g.steps.findIndex(s => !s.done);
  let nodes = '<circle class="gp-base-dot" cx="' + f1(pts[0][0]) + '" cy="' + f1(pts[0][1]) + '" r="6"/>';
  g.steps.forEach((s, i) => {
    const p = pts[i + 1]; const cls = s.done ? 'done' : i === nextIdx ? 'next' : 'todo';
    nodes += '<g class="gp-node ' + cls + '" data-act="stepToggle" data-id="' + s.id + '" style="--d:' + (i * 70) + 'ms" role="button" aria-label="' + esc(s.title) + (s.done ? ', done' : '') + '"><title>' + esc(s.title) + '</title>' +
      (cls === 'next' ? '<circle class="gp-pulse" cx="' + f1(p[0]) + '" cy="' + f1(p[1]) + '" r="' + r + '"/>' : '') +
      '<circle class="gp-hit" cx="' + f1(p[0]) + '" cy="' + f1(p[1]) + '" r="' + (r + 8) + '"/><circle class="gp-c" cx="' + f1(p[0]) + '" cy="' + f1(p[1]) + '" r="' + r + '"/>' +
      (s.done ? '<path class="gp-tick" d="M' + f1(p[0] - r * .38) + ' ' + f1(p[1] + r * .04) + 'l' + f1(r * .26) + ' ' + f1(r * .28) + 'l' + f1(r * .5) + ' ' + f1(-r * .56) + '"/>'
        : '<text x="' + f1(p[0]) + '" y="' + f1(p[1]) + '" font-size="' + (r > 14 ? 14 : 11) + '">' + (i + 1) + '</text>') + '</g>';
  });
  const sp = pts[m];
  nodes += '<g class="gp-summit' + (reached ? ' reached' : '') + '" style="--d:' + (n * 70) + 'ms"><circle class="gp-glow" cx="' + f1(sp[0]) + '" cy="' + f1(sp[1]) + '" r="40"/><circle class="gp-c" cx="' + f1(sp[0]) + '" cy="' + f1(sp[1]) + '" r="25"/>' +
    '<svg x="' + f1(sp[0] - 12) + '" y="' + f1(sp[1] - 12) + '" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + ICONS.flag + '</svg></g>';
  return '<svg class="gpath" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="' + lead + ' of ' + n + ' steps done">' +
    '<path class="gp-hill far" d="M0 330V232l96-62 78 44 128-116 92 84 118-128 96 96 152-82v262z"/><path class="gp-hill" d="M0 330v-52l130-66 110 50 150-104 120 78 250-150v244z"/>' +
    '<path class="gp-line" d="' + d + '"/><path class="gp-lit" id="gp-lit" d="' + d + '" data-x="' + f1(pts[litTo][0]) + '"/>' + nodes + '</svg>';
}
let gpPrev = 0, gpGoal = null;
function lenAtX(path, x) { const total = path.getTotalLength(); let lo = 0, hi = total; for (let i = 0; i < 22; i++) { const mid = (lo + hi) / 2; if (path.getPointAtLength(mid).x < x) lo = mid; else hi = mid; } return lo; }

}
function giEmbers(cv) {

  const ts = S.tasks.filter(t => t.date === k); part(.15, ts.length ? ts.filter(t => t.done).length / ts.length : null);

  const sched = liveHabits().reduce((a, h) => a + h.days.length, 0); if (sched) opts.push({ type: 'habits', target: Math.max(5, Math.round(sched * 0.85)), xp: 120 });

    p.k += dt; if (p.k >= p.life) { p.dead = 1; continue; }
    p.iy += p.vy * dt; p.ix += p.vx * dt; const q = drPt(p.ix, p.iy), u = p.k / p.life, a = Math.sin(u * Math.PI) * (.55 + .45 * Math.sin(p.ph + p.k * 7));
    put(S5.glow, q.x, q.y, p.sz * g.s * 1.25, 0, 1, a * .9); if (p.st) put(S5.star, q.x, q.y, p.sz * g.s * 1.1, p.ph + p.k * .8, 1, a);
  }
  c.globalCompositeOperation = 'source-over'; c.globalAlpha = 1;
  for (let i = 0; i < P.length; i++) { if (!P[i].dead) P[n++] = P[i]; } P.length = n;
}

A.subDel = el => { const a = areaById(el.dataset.a); if (!a) return; a.subjects = a.subjects.filter(x => x.id !== el.dataset.id); save(); keepScroll(render); };
A.topAdd = el => { const s = findSub(el.dataset.a, el.dataset.s); const name = el.value.trim(); if (!s || !name) return; s.topics.push({ id: uid(), name }); save(); const a = el.dataset.a, sid = el.dataset.s; keepScroll(render); const again = $('.add-in[data-s="' + sid + '"][data-a="' + a + '"]'); if (again) again.focus(); };
CH.topSet = el => { const s = findSub(el.dataset.a, el.dataset.s); const t = s && s.topics.find(x => x.id === el.dataset.id); if (t) { t.name = el.value.trim() || 'Topic'; save(); } };
A.topDel = el => { const s = findSub(el.dataset.a, el.dataset.s); if (!s) return; s.topics = s.topics.filter(x => x.id !== el.dataset.id); save(); keepScroll(render); };
CH.quotes = el => { S.settings.quotes = el.value.split('\n').map(x => x.trim()).filter(Boolean).slice(0, 60); save(); toast(S.settings.quotes.length ? S.settings.quotes.length + ' of your lines saved' : 'Your lines cleared'); };
CH.revIv = el => { const iv = el.value.split(/[,\s]+/).map(x => Math.round(num(x, 0))).filter(x => x > 0).slice(0, 10); if (iv.length) S.settings.revIntervals = iv; save(); keepScroll(render); };

/* ---------- backup ---------- */
const inFrame = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
let BK_PROMPT = false;
function backupDone(msg) {
  S.lastBackup = Date.now(); flush();
  if (BK_PROMPT && modalStack.length) closeModal();
  keepScroll(render); toast(msg);
}
A.backupSave = async () => {
  flush();
  const text = exportData(); const name = 'Focus-backup-' + todayKey() + '.json';
  for (const type of ['application/json', 'text/plain']) {
    try {
      const file = new File([text], name, { type });
      if (navigator.canShare && navigator.canShare({ files: [file] })) { await navigator.share({ files: [file] }); backupDone('Backup done. Keep the file in Files'); return; }
    } catch (e) { if (e && e.name === 'AbortError') return; }
  }
  if (inFrame) { A.backupCopy(); return; }
  try {
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name;
    document.body.appendChild(a); a.click(); a.remove(); backupDone('Backup file saved');
  } catch (e) { A.backupCopy(); }
};
/* Weekly prompt: appears at the set time if Focus is open, otherwise the next time it is opened */
function maybePromptBackup() {
  if (!backupDue() || S.timer || modalStack.length || celOn) return;
  const m = backupMoment(); if (S.backupAsked === m) return;
  S.backupAsked = m; save(); BK_PROMPT = true;
  openModal('<div class="modal-h"><div class="grow"><h2>Time for your weekly backup</h2><p>Save one file with everything in Focus: sessions, tasks, streaks, trophies and settings. Tap Back up now, then choose Save to Files.</p></div></div>' +
    '<div class="modal-b"><div class="small muted num">' + S.sessions.length + ' sessions and ' + S.tasks.length + ' tasks. ' + (S.lastBackup ? 'Last backup ' + fmtDate(dkey(S.lastBackup)) + ' at ' + fmtTime(S.lastBackup) + '.' : 'No backup saved yet.') + '</div></div>' +
    '<div class="modal-f"><button class="btn" data-act="closeModal">Later</button><button class="btn primary" data-act="backupSave">' + ic('download', 18) + 'Back up now</button></div>', { onClose: () => { BK_PROMPT = false; } });
}
A.backupCopy = async () => {
  const text = exportData();
  try { await navigator.clipboard.writeText(text); backupDone('Backup copied. Paste it into Notes or Files to keep it'); }
  catch (e) {
    openModal(modalHead('Copy your backup', 'Select all of this text, copy it and keep it somewhere safe.') + '<div class="modal-b"><textarea class="textarea" style="min-height:220px" readonly id="bk-out"></textarea></div><div class="modal-f"><button class="btn primary" data-act="closeModal">Done</button></div>');
    const t = $('#bk-out'); t.value = text; t.focus(); t.select();
  }
};
function doImport(text) {
  confirmBox('Replace everything with this backup?', 'Your current sessions, tasks and settings are overwritten.', 'Restore', () => {
    const err = importData(text);
    if (err) { toast(err); return; }
    while (modalStack.length) closeModal();
    applyTheme(); evaluateDays(); S.lastOpen = todayKey(); save(); render(); toast('Backup restored');
  }, true);
}
CH.backupFile = el => { const f = el.files && el.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => doImport(String(r.result)); r.onerror = () => toast('That file could not be read'); r.readAsText(f); el.value = ''; };
A.backupPaste = () => openModal(modalHead('Paste backup text', 'Paste the full text of a Focus backup.') + '<div class="modal-b"><textarea class="textarea" style="min-height:200px" id="bk-in" placeholder="Paste here"></textarea></div><div class="modal-f"><button class="btn" data-act="closeModal">Cancel</button><button class="btn primary" data-act="backupPasteGo">Restore</button></div>');
A.backupPasteGo = () => { const t = $('#bk-in').value.trim(); if (!t) { toast('Paste the backup text first'); return; } doImport(t); };
A.resetAll = () => confirmBox('Erase everything?', 'Every session, task, trophy and setting is deleted. This cannot be undone.', 'Erase everything', () => {
  stopLoop(); wakeOff();
  try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(SEEN_KEY); } catch (e) { /* ignore */ }
  S = defaults(); dirty(); S.lastOpen = todayKey(); flush(); applyTheme(); V.view = 'home'; render(); toast('Everything erased');
}, true);

/* ---------- start ---------- */
function boot() {
  load(); applyTheme(); renderShell();
  const hash = (location.hash || '').slice(1); if (VIEWS[hash]) V.view = hash;
  dateCheck(true);
  if (S.timer) {
    let since = null; try { since = Number(localStorage.getItem(SEEN_KEY)) || null; } catch (e) { /* ignore */ }
    V.view = 'focus';
    document.body.classList.toggle('running', S.timer.phase === 'focus');
    render();
    if (since) onReturn(since); else startLoop();
  } else {
    render();
    if (S.settings.morningPlan && !S.planDone[todayKey()]) setTimeout(() => { if (!modalStack.length && !S.timer) openPlan(); }, 450);
  }
  setInterval(() => {
    if (dateCheck()) { if (S.settings.morningPlan && !S.timer && !modalStack.length) openPlan(); return; }
    if (S.timer && V.view === 'home' && !modalStack.length) keepScroll(render);
    if (backupDue() && V.view === 'home' && !modalStack.length && !$('.notice')) keepScroll(render);
    maybePromptBackup();
    alexDaily(); alexNudge();
  }, 30000);
  setTimeout(maybePromptBackup, 2500);
  setTimeout(alexDaily, 4200);
  window.addEventListener('hashchange', () => { const h = (location.hash || '').slice(1); if (VIEWS[h] && h !== V.view) go(h); });
  if (window.matchMedia) { const mq = window.matchMedia('(prefers-color-scheme: light)'); const fn = () => { if (S.settings.theme === 'auto') applyTheme(); }; if (mq.addEventListener) mq.addEventListener('change', fn); else if (mq.addListener) mq.addListener(fn); }
  if (SW_ENABLED && 'serviceWorker' in navigator && !inFrame && (location.protocol === 'https:' || location.hostname === 'localhost')) { try { navigator.serviceWorker.register('sw.js').catch(() => { }); } catch (e) { /* offline support is optional */ } }
}
boot();

})();
</script>
